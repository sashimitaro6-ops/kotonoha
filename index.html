/* ---------- 成長 ---------- */
/* カレンダーのマスを押したとき */
function heatTip(k){
  const d = S.days[k], p = d ? d.pts : 0;
  const st = d && d.goalMet ? "・目標達成 🌸" : S.rest[k] === "ticket" ? "・復活券 🎫" : travelDay(k) ? "・移動の日 🧳" : S.rest[k] ? "・おやすみ" : "";
  toast(""); $("toast").innerHTML = furi(`${mdJ(k)}：${p}ポイント${st}`);
}
function renderProgress(){
  $("s-total").textContent = S.total;
  $("s-best").textContent = Math.max(S.bestStreak, streak());
  $("s-sent").textContent = S.writings.length + S.diaries.length;
  $("s-diary").textContent = S.diaries.length;
  const end = parseKey(todayKey()), start = addDays(parseKey(weekKey(end)), -7*11), tk = todayKey();
  // 1行目：月（その週に月が変わったところ・左はし）。2行目から：曜日＋7日×12週
  let h = '<div class="hd"></div>';
  for(let w = 0; w < 12; w++){
    const a = addDays(start, w*7), b = addDays(a, 6), m = b.getDate() <= 7 || w === 0 ? (w === 0 ? a : b).getMonth() + 1 : 0;
    h += `<div class="hd mo">${m ? m + "月" : ""}</div>`;
  }
  ["月","火","水","木","金","土","日"].forEach((wd, r) => {
    h += `<div class="hd">${r % 2 ? "" : wd}</div>`;
    for(let w = 0; w < 12; w++){
      const dt = addDays(start, w*7 + r), k = ymd(dt);
      if(dt > end){ h += '<div class="c fu"></div>'; continue; }
      const p = S.days[k] ? S.days[k].pts : 0, met = !!(S.days[k] && S.days[k].goalMet);
      const extra = met && daySig(S.days[k]) > CONFIG.daily.particles + CONFIG.daily.writing + CONFIG.daily.diary;   // 目標のあとも練習した日
      const c = (S.rest[k] || travelDay(k)) && !met ? "hr" : met ? (extra ? "h3" : "h2") : p > 0 ? "h1" : "";
      h += `<div class="c ${c}${k === tk ? " today" : ""}" onclick="heatTip('${k}')"></div>`;
    }
  });
  $("heat").innerHTML = h;
  const parts = ["は","が","を","に","で","へ","と","や","か","も","の","から","まで","より","だけ","しか"];
  const rows = parts.filter(p => S.partStats[p]).map(p => { const s = S.partStats[p], n = s.c+s.w, pct = Math.round(100*s.c/n);
    return `<div class="pbar"><span class="k">${p}</span><div class="bar ${pct>=80?"g":""}"><div style="width:${pct}%"></div></div><span class="muted">${pct}% <span class="small">(${n})</span></span></div>`; });
  $("pstats").innerHTML = rows.length ? rows.join("") + confHtml(3)
    : `<div class="empty"><div class="big">🎀</div>${T("助詞の練習をするとここに出るよ","Faça um exercício de partículas para ver aqui.")}</div>`;
  const seen = Object.keys(S.tstats).length, good = Object.values(S.tstats).filter(s => s.grade === 3).length;
  $("wstats").innerHTML = `<p>${T(`練習した文：<b>${seen} / ${TR.length}</b>`, "Frases diferentes já praticadas")}</p><p>${T(`最後に ◎ だった文：<b>${good}</b>`, "Marcadas como ◎ na última vez")}</p>
    <div class="bar g" style="margin-top:8px"><div style="width:${Math.round(100*good/TR.length)}%"></div></div>`;
  $("outbox-status").innerHTML = !CONFIG.scriptUrl ? T("メール：まだ設定されていません","E-mail: ainda não configurado.")
    : S.outbox.length ? T(`✉️ ${S.outbox.length}件 送信待ち`, "Mensagens esperando internet para enviar.") : "";
}

/* ---------- ノート（見かえす） ---------- */
/* 助詞の とりちがえ：「ただしくは a」の ところで「c」を えらんだ 回数（days の pwq から 数える） */
function confusions(){
  const m = {};
  Object.values(S.days).forEach(d => (d.pwq || []).forEach(w => {
    const q = PQ.find(x => x.id === w.id); if(!q || !w.chose || w.chose === q.a) return;
    const k = q.a + "→" + w.chose; m[k] = (m[k] || 0) + 1; }));
  return Object.entries(m).map(([k, n]) => { const [a, c] = k.split("→"); return {a, c, n}; }).sort((x, y) => y.n - x.n);
}
function confHtml(max){
  const cf = confusions().slice(0, max); if(!cf.length) return "";
  return `<div class="muted small" style="font-weight:700;margin-top:12px">${T("よく取り違える助詞","Trocas mais comuns (✕ escolhida → ○ certa)")}</div>` + cf.map(x =>
    `<div class="item" style="padding:8px 0">${T(`✕「<b>${esc(x.c)}</b>」→ ○「<b class="hl">${esc(x.a)}</b>」 <span class="muted small">${x.n}回</span>`, `Você escolheu ${esc(x.c)}; o certo era ${esc(x.a)} (${x.n}×)`)}</div>`).join("");
}
function speakQ(id){ const q = PQ.find(x => x.id === id); if(q) speak(q.jp.replace("＿", q.a)); }
function speakT(id){ const q = TR.find(x => x.id === id); if(q) speak(q.a[0]); }
function speakR(i, j){ speak(RULES[i][1][j][2].replace(/[\[\]]/g, "")); }
const spkBtn = call => canSpeak ? `<button class="spk" onclick="${call}" aria-label="Ouvir">🔊</button>` : "";
let noteTab = "m";
function openNote(tab){
  if(tab) noteTab = tab; curRun = null;
  $("practice-menu").style.display = "none"; $("practice-run").style.display = "";
  const tabs = [["m","🌧️ 間違い","Erros"],["w",`${ICO("pencil")} 書いた文`,"Frases"],["r","🎀 ルール","Regras"]];
  let body = "";
  if(noteTab === "m"){
    const bx = q => S.pstats[q.id].box || 0;
    const ms = PQ.filter(q => S.pstats[q.id] && S.pstats[q.id].w > 0).sort((a, b) => bx(a) - bx(b) || S.pstats[b.id].w - S.pstats[a.id].w).slice(0, 40);
    const cf = confHtml(5);
    body = (cf ? `<div class="card">${cf}</div>` : "") + `<div class="card">` + (ms.length ? ms.map(q => { const s = S.pstats[q.id];
        return `<div class="item"><div class="jpx">${T(furi(esc(q.jp)).replace("＿", `<span class="blank ok">${q.a}</span>`), esc(q.pt), true)}${spkBtn(`speakQ('${q.id}')`)}</div>
          <div class="explain" style="margin-top:8px;font-size:14px">${T(furi(esc(q.exj)), esc(q.ex), true)}</div>
          <div class="muted small" style="margin-top:4px">✕ ${s.w}・○ ${s.c}${bx(q) >= 3 ? `・${T("🌸 覚えてきたよ","Você está aprendendo!")}` : ""}</div></div>`; }).join("")
      : `<div class="empty"><div class="big">🌸</div>${T("間違えた問題はまだないよ","Você ainda não errou nenhuma pergunta.")}</div>`) + `</div>`;
  } else if(noteTab === "w"){
    const ws = S.writings.slice(-40).reverse().map(w => { const q = TR.find(x => x.id === w.id); if(!q) return "";
      const g = w.auto ? T("🌸 ぴったり","Perfeito") : w.idk ? T("🤔 分からなかった","Não sabia") : T(GRADE[w.grade] || "", {3:"Acertei", 2:"Quase", 1:"Errei"}[w.grade] || "");
      return `<div class="item"><div class="muted small">${esc(w.date)}・${g}${w.re ? `・${T("✍️ 書き直した","Reescrita")}` : ""}</div>
        <div class="meaning">${ICO("flag-br")} ${esc(q.pt)}</div>${w.ans ? `<div class="yours">${esc(w.ans)}</div>` : ""}
        <div class="model">${furi(esc(q.a[0]))}${spkBtn(`speakT('${q.id}')`)}</div></div>`; }).join("");
    body = `<div class="card">` + (ws ? ws
      : `<div class="empty">${IMG("pencil", "bimg", "width:80px;height:80px")}${T("作文をするとここに出るよ","Faça um exercício de escrita para ver aqui.")}</div>`) + `</div>`;
  } else {
    body = `<div class="card">` + RULES.map((r, i) => { const s = S.partStats[r[0]];
      return `<div class="item row" style="align-items:flex-start"><div class="rule-k">${r[0]}${s ? `<div class="muted small" style="font-weight:500">${Math.round(100*s.c/(s.c+s.w))}%</div>` : ""}</div><div style="flex:1">` + r[1].map((u, j) =>
        `<div style="margin-bottom:10px"><div style="font-size:14px">${T(furi(esc(u[0])), esc(u[1]), true)}</div><div class="jpx">${furi(esc(u[2])).replace(/\[(.+?)\]/g, '<b class="hl">$1</b>')}${spkBtn(`speakR(${i},${j})`)}</div></div>`).join("") + `</div></div>`; }).join("") + `</div>`;
  }
  $("practice-run").innerHTML = `<div class="top"><button class="ghost" onclick="go('practice')">✕</button><b>📒 ノート</b>${topBtns()}</div>
    <div class="tabs">${tabs.map(t => `<button class="${t[0] === noteTab ? "on" : ""}" onclick="openNote('${t[0]}')">${T(t[1], t[2])}</button>`).join("")}</div>${body}${tipLine()}`;
  applyPt();
}

async function exportData(){
  const name = `kotonoha-backup-${todayKey()}.json`, json = JSON.stringify(snapshot());
  // iPhone のホーム画面アプリではダウンロードが動かないことがあるので、まず「共有」をためす
  try{
    const f = new File([json], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], {type:"application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
let pendingImport = null;
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const s = JSON.parse(await unpackSnap(r.result)); if(!s || typeof s.total !== "number" || !s.days || typeof s.days !== "object") throw 0;
      pendingImport = s;
      const last = Object.keys(s.days).sort().pop() || "—";
      modal(`<div class="big">📦</div><h2>${T("このデータに戻す？","Restaurar estes dados?")}</h2>
        <p>${T(`ファイル：<b>${Number(s.total)}</b> ポイント（最後の日：${esc(last)}）`, `Arquivo: ${Number(s.total)} pontos (último dia: ${esc(last)})`)}</p>
        <p>${T(`今のデータ：<b>${S.total}</b> ポイント`, `Dados atuais: ${S.total} pontos`)}</p>
        <p class="muted small">${T("今のデータは、ファイルのデータに変わるよ。","Os dados atuais serão substituídos pelos do arquivo.")}</p>
        <div class="grid2" style="margin-top:14px"><button class="ghost" onclick="pendingImport=null;closeModal()">${T("やめる","Cancelar")}</button><button onclick="confirmImport()">${T("戻す","Restaurar")}</button></div>`);
      applyPt();
    }catch(e){ toast("ファイルが違うみたい"); }
  };
  r.readAsText(f); inp.value = "";
}
function confirmImport(){
  const s = pendingImport; pendingImport = null; closeModal();
  if(!s) return;
  try{ localStorage.setItem(KEY + "-before-restore", JSON.stringify(S)); }catch(e){}   // 上書きする前のデータを残す
  const box = S.outbox;                                                               // 送信待ちメールはそのまま
  S = Object.assign(blank(), s); S.outbox = box; furiDefault();
  save(); refresh(); toast("戻したよ ✓");
}

const LD = (() => { try{ return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(LETTER_DATA), c => c.charCodeAt(0)))); }catch(e){ return {letters:[]}; } })();
const LETTERS = LD.letters || [];
/* ご褒美「ジャスから日本語の手紙」への手紙（別枠）。letters.json の gifts に {id:"rw1", n:1, title, jp, pt} で入れる。
   n ＝ その手紙のご褒美を交換した何回目か。交換していれば届き、その交換は自動で「もらった」になる。 */
const GIFTS = LD.gifts || [];
const GIFT_REWARD = "r1";
const giftReds = () => S.redemptions.map((x, i) => [x, i]).filter(([x]) => x.id === GIFT_REWARD);
const findLetter = id => LETTERS.find(x => x.id === id) || GIFTS.find(x => x.id === id);
const isGift = id => GIFTS.some(x => x.id === id);
const CDN = LETTERS.filter(l => l.c.t === "cd").map(l => l.c.n).sort((a, b) => b - a);
const daysTo = k => Math.round((parseKey(k) - parseKey(todayKey())) / 864e5);
const cdLeft = () => LD.arrive ? daysTo(LD.arrive) : null;
const cdBelow = n => CDN.filter(m => m < n)[0];   // ひとつ下の区切り（90 → 60）
function letterDue(l){
  const c = l.c, left = cdLeft();
  switch(c.t){
    case "first": return !!S.tutV;
    case "goal": return Object.values(S.days).filter(d => d.goalMet).length >= c.n;
    case "diary": return S.diaries.length >= c.n;
    case "streak": return Math.max(S.bestStreak || 0, streak()) >= c.n;
    case "level": return false;   // レベルのしくみをなくした（2026-11-24）。もう届かない
    case "total": return S.total >= c.n;
    case "perfect": return (S.perfects || 0) >= c.n;
    case "redeem": return S.redemptions.length >= c.n;
    case "date": { const t = todayKey(), d0 = new Date().getFullYear() + "-" + c.md; return t >= d0 && t <= ymd(addDays(parseKey(d0), 2)); }   // その日から3日のうちに開けば届く
    case "cd": { const lo = cdBelow(c.n); return left !== null && left >= 1 && left <= c.n && (lo === undefined || left > lo); }
    case "arrive": return left !== null && left <= 0 && left > -14;
  }
  return false;
}
/* もう届かない手紙（カウントダウンの区切りが過ぎた）は「まだの手紙」に出さない */
function letterGone(l){
  const c = l.c, left = cdLeft();
  if(c.t === "cd"){ const lo = cdBelow(c.n); return left === null || left < 1 || (lo !== undefined && left <= lo); }
  if(c.t === "arrive") return left === null || left <= -14;
  if(c.t === "level") return true;
  return false;
}
function letterHint(c){
  switch(c.t){
    case "first": return ["チュートリアルのあとで届く","Chega depois do tutorial"];
    case "goal": return [`目標を${c.n}回達成すると届く`, `Chega quando você concluir a meta ${c.n} vez(es)`];
    case "diary": return [`日記を${c.n}件送ると届く`, `Chega quando você enviar ${c.n} diário(s)`];
    case "streak": return [`${dayR(c.n)}連続で届く`, `Chega com ${c.n} dias seguidos`];
    case "total": return [`全部で${c.n}ポイントになると届く`, `Chega quando você somar ${c.n} pontos`];
    case "perfect": return ["助詞で全問正解すると届く","Chega quando você acertar todas as partículas"];
    case "redeem": return ["ご褒美を交換すると届く","Chega quando você trocar um prêmio"];
    case "date": return ["特別な日に届く 🎁","Chega num dia especial 🎁"];
    case "cd": return [`日本まであと${dayR(c.n)}の日に届く`, `Chega quando faltarem ${c.n} dia(s) para o Japão`];
    case "arrive": return ["日本に着いた日に届く","Chega no dia em que você chegar ao Japão"];
  }
  return ["",""];
}
function checkLetters(){
  if(!S.letters) S.letters = {};
  let n = 0;
  LETTERS.forEach(l => { if(!S.letters[l.id] && letterDue(l)){ S.letters[l.id] = {ts:Date.now()}; n++; } });
  const reds = giftReds();
  GIFTS.forEach(g => { const r = reds[g.n - 1]; if(r && !S.letters[g.id]){ S.letters[g.id] = {ts:Date.now()}; if(!r[0].got) r[0].got = Date.now(); n++; } });
  if(n) save();
}
/* 手紙の日本語（「3日」は みっか と読むように dayR を使ってから、ふりがなを つける） */
const ljp = t => furi(esc(t).replace(/(\d+)日/g, (m, n) => dayR(+n))).replace(/\n/g, "<br>");
const unreadLetters = () => LETTERS.filter(l => S.letters && S.letters[l.id] && !S.letters[l.id].r);
const unreadAll = () => LETTERS.concat(GIFTS).filter(l => S.letters && S.letters[l.id] && !S.letters[l.id].r);
function renderMailBtn(){
  const got = LETTERS.filter(l => S.letters && S.letters[l.id]).length, un = unreadLetters().length;
  $("b-mail").innerHTML = `<b>${furi("ジャスからの手紙")}${un ? `<span class="mailnew">${un}</span>` : ""}</b>`
    + (got ? `<span class="cnt">${furi(got + "通")}</span>` : "");
}
/* ホームを開いたとき：日本に着いた日のお祝い、新しい手紙のお知らせ */
function homeEvents(){
  const left = cdLeft();
  if(left !== null && left <= 0 && left > -3 && !S.arrived){
    S.arrived = 1; save();
    setTimeout(() => { FX.dark(420); FX.fireworks(20, {gap:220, big:true}); Party.rose(); FX.confetti(200); stamp("日本へようこそ！🇯🇵", "Bem-vinda ao Japão!", "big gold"); buzz([80, 60, 80, 60, 300]); }, 600);
  }
  const fresh = unreadAll().filter(l => !S.letters[l.id].n);
  if(!fresh.length) return;
  fresh.forEach(l => S.letters[l.id].n = 1); save();
  const l = fresh.find(x => isGift(x.id)) || fresh[0], gift = isGift(l.id), special = gift || ["date","cd","arrive"].includes(l.c.t);
  setTimeout(() => {
    // そのあいだに練習などの画面に移っていたら、知らせるのは次にホームを開いたときにする
    if(!$("home").classList.contains("on")){ fresh.forEach(x => S.letters[x.id].n = 0); save(); return; }
    FX.rain(HEARTS.concat(["💌"]), special ? 50 : 30, {dur:1800});
    if(special) FX.fireworks(6, {shape:"heart"});
    queueModal(`<div class="env" onclick="openLetter('${l.id}')">${IMG("bunny-letter", "")}</div>
      <h2>${gift ? T("ご褒美の手紙が届いたよ！","Chegou a sua carta-prêmio!") : T(fresh.length > 1 ? `ジャスから手紙が${fresh.length}通届いたよ！` : "ジャスから手紙が届いたよ！", fresh.length > 1 ? `Chegaram ${fresh.length} cartas do Jas!` : "Chegou uma carta do Jas!")}</h2>
      <p class="muted">${T(`「${ljp(l.title[0])}」`, l.title[1])}</p>
      <div class="grid2" style="margin-top:14px"><button class="ghost" onclick="closeModal()">${T("あとで","Depois")}</button><button onclick="openLetter('${l.id}')">${T("開ける 💌","Abrir")}</button></div>`);
  }, 1600);
}
function openLetter(id){
  const l = findLetter(id); if(!l) return;
  modal(`<div class="env" onclick="revealLetter('${id}')">${IMG("icon-letter", "")}</div><h2>${T(ljp(l.title[0]), l.title[1])}</h2>
    <p class="muted">${T("封筒を押して開けてね","Toque no envelope para abrir")}</p>`);
  applyPt();
}
function revealLetter(id){
  const l = findLetter(id); if(!l) return;
  const [x, y] = centerOf(document.querySelector(".env") || document.body);
  FX.burst(x, y, HEARTS.concat(ROSES), 30, {min:4, max:12, s1:20, s2:38}); buzz([30, 40, 30]);
  if(S.letters[id] && !S.letters[id].r){ S.letters[id].r = Date.now(); save(); }
  modal(`<div class="paper"><div class="pt">💌 ${ljp(l.title[0])}</div>
      <div class="pj">${ljp(l.jp)}</div>
      <div class="pp">${ICO("flag-br")} ${esc(l.pt).replace(/\n/g, "<br>")}</div>
      ${canSpeak ? `<button class="spk wide" onclick="speak(findLetter('${id}').jp)" aria-label="Ouvir">🔊</button>` : ""}</div>
    <div class="grid2" style="margin-top:14px">${isGift(id) ? `<button class="ghost" onclick="closeModal();go('prizes')">${T("ご褒美","Prêmios")}</button>` : `<button class="ghost" onclick="openMailbox()">${T("手紙箱","Cartas")}</button>`}<button onclick="closeModal()">${T("閉じる","Fechar")}</button></div>`);
  applyPt(); refresh();
}
function openMailbox(){
  checkLetters();
  const got = LETTERS.filter(l => S.letters[l.id]).sort((a, b) => S.letters[b.id].ts - S.letters[a.id].ts);
  const wait = LETTERS.filter(l => !S.letters[l.id] && !letterGone(l));
  const row = l => `<button class="mrow" onclick="openLetter('${l.id}')"><span style="font-size:24px">${S.letters[l.id].r ? "📩" : "💌"}</span>
    <span style="flex:1">${T(ljp(l.title[0]), l.title[1])}<span class="muted small" style="display:block">${new Date(S.letters[l.id].ts).toLocaleDateString("ja-JP")}</span></span>${S.letters[l.id].r ? "" : `<span class="mailnew">NEW</span>`}</button>`;
  const lock = l => { const h = letterHint(l.c); return `<div class="mrow lock"><span style="font-size:22px">🔒</span><span style="flex:1">${T(h[0], h[1])}</span></div>`; };
  modal(`<div class="big" style="font-size:44px">💌</div><h2>${T("ジャスからの手紙","Cartas do Jas")}</h2>
    <div style="text-align:left">${got.length ? got.map(row).join("") : `<p class="muted">${T("まだ届いていないよ","Ainda não chegou nenhuma.")}</p>`}
    ${wait.length ? `<div class="muted small" style="font-weight:700;margin:14px 4px 0">${T(`これから届く手紙：あと${wait.length}通`, `Cartas que ainda vão chegar: ${wait.length}`)}</div>` + wait.map(lock).join("") : ""}</div>
    <button class="block" style="margin-top:14px" onclick="closeModal()">${T("閉じる","Fechar")}</button>`);
  applyPt();
}
/* ホームの カウントダウン（ブラジル → 日本 の 飛行機） */
function renderCountdown(){
  const el = $("cd-card"), left = cdLeft();
  if(left === null){ el.style.display = "none"; return; }
  el.style.display = "";
  const a = parseKey(LD.arrive), st = parseKey(LD.start || todayKey());
  const pct = left <= 0 ? 100 : Math.max(2, Math.min(98, Math.round(100 * (parseKey(todayKey()) - st) / ((a - st) || 1))));
  const md = `${a.getMonth() + 1}月${dayR(a.getDate())}`;
  const head = left > 0 ? T(`✈️ 日本まで あと<ruby><span class="cdn">${left}</span>日<rt>${DAYR[left] || "にち"}</rt></ruby>`, `Faltam ${left} dia(s) para você chegar ao Japão`)
    : left === 0 ? T("🌸 今日、日本に着く日！","Hoje é o dia de chegar ao Japão!")
    : T(`🌸 日本に来て ${dayR(1 - left)}目`, `${1 - left}º dia no Japão`);
  el.innerHTML = `<div style="font-weight:900;font-size:17px">${head}</div>
    <img class="cdimg" src="images/journey.webp" alt="" draggable="false" onerror="imgFail(this)">
    <div class="bar" style="height:8px"><div style="width:${pct}%"></div></div>

    ${left >= 0 && left <= (CONFIG.travelDays || 0) + 3 ? `${IMG("bunny-travel", "bimg", "width:90px;height:90px;margin-top:6px")}<div class="small" style="margin-top:6px;font-weight:700">${T(`🧳 ${(t0 => `${t0.getMonth() + 1}月${dayR(t0.getDate())}`)(addDays(a, -(CONFIG.travelDays || 0)))}から${md}までは移動の日。練習しなくても、連続記録は切れないよ。`, `De ${mdP(ymd(addDays(a, -(CONFIG.travelDays || 0))))} até ${a.getDate()}/${a.getMonth() + 1} são dias de viagem: mesmo sem praticar, sua sequência não será interrompida.`)}</div>` : ""}`;
}

/* ---------- チュートリアル（初めて開いたときに1回。「成長 → 使い方を見る」でもう一度見られる） ----------
   読めないと困るので、ポルトガル語の訳を最初から出しておく。見終わったら S.tutV = 1。 */
const standalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches));
function tutSteps(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), mail = CONFIG.studentEmail || CONFIG.replyByMail;
  const prep = [];
  if(!standalone()) prep.push(ios ? ["Safariの共有ボタン（□に↑）→「ホーム画面に追加」を押すと、アプリのように使えるよ","No Safari, toque em Compartilhar (□↑) → “Adicionar à Tela de Início” para usar como um app."]
    : ["Chromeのメニュー（⋮）→「ホーム画面に追加」を押すと、アプリのように使えるよ","No Chrome, toque no menu (⋮) → “Adicionar à tela inicial” para usar como um app."]);
  prep.push(["作文と日記では日本語のキーボードを使うよ。スマホの設定で追加してね","Na escrita e no diário você vai usar o teclado japonês. Adicione nas configurações do celular."],
    ["データはこのスマホの中に保存されるよ。ジャスにもバックアップが届くから安心してね","Seus dados ficam salvos neste celular, e o Jas também recebe um backup. Pode ficar tranquila."]);
  return [
    {ic:IMG("bunny-hello"), h:["ことのはの森へようこそ！","Bem-vinda à Floresta das Palavras!"], b:[
      ["ジャスが、あなたのために作った日本語の練習アプリだよ","O Jas fez este app de japonês especialmente para você."],
      ["毎日少しずつ練習して、日本に来る日の準備をしよう 🌸","Vamos praticar um pouquinho todo dia e nos preparar para a sua chegada ao Japão."]]},
    {ic:`あ ${ICO("flag-br")}`, h:["二つのボタン","Dois botões"], b:[
      ["「あ」：漢字の上の読み方を出す・消す","「あ」: mostra ou esconde a leitura em cima dos kanji."],
      [`${ICO("flag-br")}：ポルトガル語の訳を出す・消す`,"🇧🇷: mostra ou esconde a tradução em português."],
      ["文を押すと、その文だけ訳が出ることもあるよ","Em algumas frases, é só tocar para ver a tradução."]]},
    {ic:"🎯", h:["毎日の目標","A meta de cada dia"], b:[
      ["助詞10問・作文3文・日記1件。三つ全部やったら目標達成！","10 partículas, 3 frases e 1 diário. Fez os três? Meta concluída!"],
      [`毎日続けると ${ICO("flame")} 連続記録がのびるよ`,"Praticando todo dia, a sua sequência 🔥 vai crescendo."],
      [`${ICO("ticket")} ストリーク復活券：目標に届かなかった次の日、ホームの「復活券を使う」で連続が元に戻るよ（毎週月曜日に1枚）`,"🎫 Cupom de sequência: no dia seguinte a um dia sem meta, toque em “Usar cupom” na tela inicial para recuperar a sequência (1 cupom toda segunda-feira)."],
      ["🌙 1日の区切りは朝3時。0時をすぎても3時までなら前の日の練習になるよ","🌙 O dia só vira às 3h da manhã. Até as 3h, conta para o dia anterior."]]},
    {ic:`${ICO("icon-particles")} ${ICO("pencil")}`, h:["練習","Os exercícios"], b:[
      ["🎀 助詞：＿に入る助詞を選ぶ。間違えた問題は、覚えるまでまた出るよ","🎀 Partículas: escolha a partícula certa. As que você errar voltam até você aprender."],
      ["✏️ 作文：ポルトガル語の文を日本語で書く。答えの例と比べて、自分で ◎○△ をつけてね。分からないときは「分からない」を押してもいいよ","✏️ Escrita: escreva a frase em japonês, compare com o exemplo e se avalie com ◎ ○ △. Se não souber, pode tocar em “Não sei”."],
      ["📒 ノート：間違えた問題・書いた文・助詞のルールを見返せるよ","📒 Caderno: reveja seus erros, as frases que escreveu e as regras das partículas."]]},
    {ic:"📔", h:["日記","O diário"], b:[
      ["今日のことを日本語で1〜3文書いてね。お題もあるよ","Escreva de 1 a 3 frases em japonês sobre o seu dia. Tem sugestão de tema também."],
      mail ? ["ジャスが読んで、メールで直して返事するよ 💌","O Jas vai ler e responder por e-mail com as correções."] : ["ジャスが読んで、直して返事するよ 💌","O Jas vai ler e responder com as correções."],
      ["間違えても大丈夫！書くことが一番の練習だよ","Tudo bem errar! Escrever é o melhor treino."]]},
    {ic:IMG("gift", "bimg", "width:90px;height:90px"), h:["ポイントとご褒美","Pontos e prêmios"], b:[
      ["練習するとポイントがたまるよ。ポイントで、ジャスからのご褒美と交換できるよ","Praticando você ganha pontos e pode trocá-los por prêmios do Jas."],
      [`ご褒美をもらったら、「${ICO("gift")} もらった」を押してね`,"Quando receber o prêmio, toque em “🎁 もらった”."],
      ["「ジャスの手紙」のご褒美は、ジャスが書いたら「ご褒美」の画面に届くよ 💌","O prêmio “carta do Jas” chega na tela de prêmios quando o Jas terminar de escrever."]]},
    {ic:"📱", h:["準備","Preparação"], b:prep},
    {ic:IMG("bunny-cheer"), h:["準備OK！","Tudo pronto!"], b:[
      ["分からないときは「成長」→「使い方を見る」で、この説明をもう一度見られるよ","Se tiver dúvida, veja esta explicação de novo em 成長 (Progresso) → 使い方を見る."],
      ["さあ、今日の練習を始めよう 🌷","Vamos começar a prática de hoje!"]]}
  ];
}
let tutI = -1;
function tutorial(i){
  const st = tutSteps(); tutI = Math.max(0, Math.min(st.length - 1, i || 0));
  const s = st[tutI], last = tutI === st.length - 1;
  modal(`<div class="big" style="font-size:44px">${s.ic}</div><h2>${T(s.h[0], s.h[1])}</h2>
    <div class="tut">${s.b.map(b => `<p>${T(b[0], b[1])}</p>`).join("")}</div>
    <div class="tdots">${st.map((_, k) => `<span class="${k === tutI ? "on" : ""}"></span>`).join("")}</div>
    ${last ? `<button class="block" style="margin-top:10px" onclick="endTutorial()">${T("始める！","Começar!")}</button>`
      : `<div class="grid2" style="margin-top:10px">${tutI ? `<button class="ghost" onclick="tutorial(${tutI - 1})">${T("← 戻る","Voltar")}</button>`
        : `<button class="ghost" onclick="endTutorial()">${T("飛ばす","Pular")}</button>`}<button onclick="tutorial(${tutI + 1})">${T("次へ →","Próximo")}</button></div>`}`);
  $("modal").querySelectorAll(".tr").forEach(e => e.classList.add("open"));
  applyPt();
}
function endTutorial(){ tutI = -1; S.tutV = 1; save(); closeModal(); go("home"); setTimeout(() => Party.start(), 300); }

$("overlay").addEventListener("click", e => { if(e.target.id === "overlay" && tutI < 0) closeModal(); });
staticTexts();
loadDraft();
if(!S.tutV) setTimeout(() => tutorial(0), 300);
dailyChecks();
catchUpReports();
refresh();
flush();
/* アプリを開いたままにして、あとで戻ってきたとき（iPhone は読みこみ直さないことが多い）にも、
   復活券・前の日のまとめ・メールの再送を行う */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  dailyChecks(); catchUpReports(); refresh(); flush();
});
/* オフラインでも開けるようにする（sw.js）。保存データを端末が勝手に消さないように頼む。 */
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
