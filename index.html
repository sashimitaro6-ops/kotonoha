<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ことのは">
<meta name="theme-color" content="#fdeef5">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<title>ことのはの森 Kotonoha</title>
<style>
:root{
  --ink:#5b4a6b; --muted:#a093ad; --line:#f1e3ee;
  --pink:#f49ac1; --pink-d:#e2689d; --pink-s:#ffe6f0;
  --lav:#b8a4f4; --lav-s:#efe9ff;
  --mint:#7fd3b6; --mint-d:#43a984; --mint-s:#e1f6ee;
  --butter:#ffd978; --butter-s:#fff5d6;
  --card:rgba(255,255,255,.92);
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--round);font-weight:500;font-size:16px;line-height:1.6;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.9) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 8%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 60% 40%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 30% 70%, rgba(255,255,255,.8) 0 2px, transparent 3px),
    radial-gradient(circle at 88% 82%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
    linear-gradient(170deg,#fde7f1 0%,#f1e8ff 45%,#e6f6f1 100%);
  background-size:220px 220px,260px 260px,300px 300px,240px 240px,280px 280px,100% 100%;
  background-attachment:fixed}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-size:21px;font-weight:900;margin:2px 0;letter-spacing:.04em}
h2{font-size:19px;font-weight:900;margin:4px 0 8px}
h3{font-size:14px;margin:22px 4px 8px;color:var(--pink-d);font-weight:900;letter-spacing:.08em}
h3::before{content:"✦ "}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
/* translation */
.tr .p{display:none;font-size:.78em;color:var(--muted);font-weight:500;line-height:1.4;margin-top:1px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
body.showpt .tr .p,.tr.open .p{display:block}
.tr.tap{cursor:pointer}
/* layout */
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 6px 18px rgba(226,104,157,.10),0 1px 0 #fff inset;border:2px solid #fff}
.row{display:flex;gap:14px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;padding:12px 14px;border:2px solid #fff;box-shadow:0 4px 12px rgba(184,164,244,.15)}
.stat .n{font-size:24px;font-weight:900}
.stat .l{font-size:13px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* buttons */
button{font:inherit;font-weight:700;border:none;border-radius:999px;padding:12px 18px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--pink) 0%,var(--lav) 100%);box-shadow:0 4px 0 rgba(226,104,157,.25)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(226,104,157,.25)}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
button.soft{background:var(--butter-s);color:#b8860b;box-shadow:0 3px 0 #f3e2a9}
button:disabled{opacity:.45;cursor:default}
button.block{width:100%;display:block}
.ptbtn,.fbtn{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;background:#fff;box-shadow:0 3px 0 var(--line);border:2px solid var(--line);flex:none}
.ptbtn.on,.fbtn.on{background:var(--mint-s);border-color:var(--mint)}
.fbtn{color:var(--ink);font-size:18px;font-weight:900}
body:not(.furi) rt{display:none}
rt{font-size:max(.45em,8px);font-weight:500;color:var(--muted);letter-spacing:0}
.spk{padding:4px 12px;font-size:15px;background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line);border:2px solid var(--line);margin-left:6px;vertical-align:middle}
.spk.wide{margin:12px 0 0}
.df-ng{background:var(--pink-s);color:var(--pink-d);border-radius:4px;text-decoration:underline wavy}
.df-add{background:var(--mint-s);color:var(--mint-d);border-radius:4px;text-decoration:underline}
.kana{letter-spacing:.08em}
.bigbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:2px solid #fff;padding:14px 16px;margin:10px 0;border-radius:24px;box-shadow:0 5px 14px rgba(184,164,244,.18)}
.bigbtn .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.bigbtn b{display:block;font-size:17px;font-weight:900}
.bigbtn .go{font-size:24px;color:var(--pink)}
.bigbtn .txt{flex:1}
.ic.pk{background:var(--pink-s)}.ic.lv{background:var(--lav-s)}.ic.mt{background:var(--mint-s)}
.done{color:var(--mint-d);font-weight:900}
/* mascot */
.hero{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.mascot{width:84px;height:84px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{position:relative;background:#fff;border-radius:20px;padding:10px 14px;margin-bottom:22px;box-shadow:0 4px 12px rgba(226,104,157,.12);font-weight:700;flex:1}
.bubble::after{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
nav .in{display:flex;max-width:500px;width:100%;background:rgba(255,255,255,.95);border-radius:28px;box-shadow:0 8px 24px rgba(184,164,244,.3);border:2px solid #fff;pointer-events:auto;padding:4px}
nav button{flex:1;background:none;box-shadow:none;color:var(--muted);border-radius:22px;padding:8px 2px 6px;font-size:11px}
nav button i{display:block;font-style:normal;font-size:21px;line-height:1.25}
nav button.on{background:var(--pink-s);color:var(--pink-d)}
section{display:none}
section.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
/* ring */
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:28px;font-weight:900;line-height:1.1}
.bar{height:12px;background:#f6eaf2;border-radius:8px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:8px;transition:width .5s}
.bar.g>div{background:linear-gradient(90deg,var(--mint),#a8e6cf)}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:900;background:var(--butter-s);color:#b8860b;border:2px solid #fff}
/* exercises */
.sentence{font-size:25px;font-weight:700;line-height:1.9;margin:8px 0 4px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:1.9em;text-align:center;border-radius:12px;background:var(--pink-s);color:var(--pink-d);margin:0 3px;padding:0 6px;line-height:1.5}
.blank.ok{background:var(--mint-s);color:var(--mint-d)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opts button{font-size:26px;padding:14px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px}
.opts button.right{background:var(--mint-s);border-color:var(--mint);color:var(--mint-d);box-shadow:0 4px 0 #bfe9d9}
.opts button.wrong{background:var(--pink-s);border-color:var(--pink);color:var(--pink-d);box-shadow:0 4px 0 #f8c9dc}
.explain{margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--lav-s);font-size:15px}
textarea,input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--pink)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 4px 4px;font-weight:700}
.model{font-size:20px;padding:10px 14px;background:var(--mint-s);border-radius:16px;margin:6px 0}
.yours{font-size:20px;padding:10px 14px;background:var(--lav-s);border-radius:16px;margin:6px 0}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grades button{padding:12px 4px;font-size:15px}
.g3{background:linear-gradient(135deg,#7fd3b6,#a8e6cf)!important}
.g2{background:linear-gradient(135deg,#ffcf6b,#ffe3a1)!important;color:#8a6500!important}
.g1{background:linear-gradient(135deg,#f49ac1,#f8c0d8)!important}
.pt-prompt{font-size:21px;font-weight:900;margin:4px 0 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.meaning{font-size:14px;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.linkbtn{background:none;box-shadow:none;color:var(--lav);padding:4px 0;font-size:14px;text-decoration:underline}
.progress-dots{display:flex;gap:5px;margin-bottom:12px}
.progress-dots span{flex:1;height:8px;border-radius:5px;background:#f6eaf2}
.progress-dots span.ok{background:var(--mint)}.progress-dots span.ng{background:var(--pink)}.progress-dots span.cur{background:var(--lav)}
/* lists */
.item{padding:12px 0;border-bottom:2px dotted var(--line)}
.item:last-child{border-bottom:none}
.item .jpx{font-size:17px;white-space:pre-wrap}
.empty{text-align:center;padding:18px 6px}
.empty .big{font-size:44px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);gap:4px;justify-content:start;overflow-x:auto}
.heat div{width:15px;height:15px;border-radius:5px;background:#f6eaf2}
.heat .h1{background:#fbd0e2}.heat .h2{background:#f49ac1}.heat .h3{background:#c77dd6}.heat .hr{background:var(--butter-s);outline:2px dashed var(--butter);outline-offset:-2px}
.pbar{display:grid;grid-template-columns:2.4em 1fr 3.8em;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.pbar .k{font-size:19px;font-weight:900;text-align:center}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(91,74,107,.35);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:28px;padding:26px 22px;max-width:360px;width:100%;text-align:center;border:3px solid var(--pink-s);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal .big{font-size:54px;animation:bob 2s ease-in-out infinite}
.modal .surprise{color:#c48a00;font-weight:900}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-140%);background:#fff;color:var(--pink-d);padding:8px 18px;border-radius:999px;font-weight:900;transition:transform .25s;z-index:30;box-shadow:0 6px 16px rgba(226,104,157,.25);border:2px solid var(--pink-s)}
.toast.on{transform:translateX(-50%) translateY(0)}
.sparkle{position:fixed;pointer-events:none;z-index:40;font-size:20px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(60vh) rotate(200deg);opacity:0}}
.bigbtn .tr .j{font-weight:500;color:var(--muted);font-size:14px}
button .tr .p{color:inherit;opacity:.8}
.opts button:disabled{opacity:1}
.explain .hd{font-weight:900;margin-bottom:6px}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tabs button{padding:10px 4px;font-size:14px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.tabs button.on{background:var(--pink-s);border-color:var(--pink);color:var(--pink-d)}
.hl{color:var(--pink-d);font-weight:900}
.rule-k{font-size:24px;font-weight:900;color:var(--pink-d);min-width:2.2em;text-align:center}
.item .model,.item .yours{font-size:17px}
</style>
</head>
<body>
<main>

<!-- ============ ホーム ============ -->
<section id="home" class="on">
  <div class="top">
    <div>
      <h1 id="hello"></h1>
      <div class="muted" id="hello-sub"></div>
    </div>
    <button class="ptbtn" id="ptbtn" onclick="togglePt()" aria-label="Mostrar português">🇧🇷</button>
  </div>

  <div class="hero">
    <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
      <ellipse cx="50" cy="93" rx="24" ry="4" fill="#e9d3e6"/>
      <ellipse cx="37" cy="27" rx="9" ry="24" fill="#fff" stroke="#f2c6da" stroke-width="2" transform="rotate(-12 37 27)"/>
      <ellipse cx="37" cy="29" rx="4" ry="16" fill="#fbcfe0" transform="rotate(-12 37 29)"/>
      <ellipse cx="63" cy="27" rx="9" ry="24" fill="#fff" stroke="#f2c6da" stroke-width="2" transform="rotate(12 63 27)"/>
      <ellipse cx="63" cy="29" rx="4" ry="16" fill="#fbcfe0" transform="rotate(12 63 29)"/>
      <circle cx="50" cy="62" r="30" fill="#fff" stroke="#f2c6da" stroke-width="2"/>
      <circle cx="40" cy="60" r="3.4" fill="#5b4a6b"/><circle cx="60" cy="60" r="3.4" fill="#5b4a6b"/>
      <circle cx="41.2" cy="58.8" r="1.1" fill="#fff"/><circle cx="61.2" cy="58.8" r="1.1" fill="#fff"/>
      <ellipse cx="33" cy="69" rx="5" ry="3" fill="#fbcfe0"/><ellipse cx="67" cy="69" rx="5" ry="3" fill="#fbcfe0"/>
      <path d="M46 68 Q50 72 54 68" stroke="#5b4a6b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M72 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffd978"/>
      <circle cx="24" cy="44" r="2" fill="#b8a4f4"/>
    </svg>
    <div class="bubble" id="bubble"></div>
  </div>

  <div class="card row">
    <div class="ring">
      <svg width="118" height="118"><circle cx="59" cy="59" r="49" stroke="#f6eaf2" stroke-width="13" fill="none"/>
        <circle id="ring-fg" cx="59" cy="59" r="49" stroke="#f49ac1" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="307.9" stroke-dashoffset="307.9" style="transition:stroke-dashoffset .6s"/></svg>
      <div class="c"><b id="today-pts">0</b><span class="muted small" id="today-goal"></span></div>
    </div>
    <div style="flex:1">
      <div style="font-size:18px;font-weight:900" id="goal-text"></div>
      <div class="muted" id="goal-sub"></div>
      <div style="margin-top:8px;font-weight:700" id="streak-line"></div>
      <div class="muted small" id="rest-status"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="stat"><div class="n" id="balance">0</div><div class="l" id="balance-l"></div></div>
    <div class="stat"><div class="n" id="lv-name">🌰</div><div class="l" id="lv-name-l"></div></div>
  </div>

  <h3 id="h-today"></h3>
  <button class="bigbtn" onclick="go('practice');startParticles()">
    <span class="ic pk">🎀</span><span class="txt" id="b-part"></span><span class="go">›</span>
  </button>
  <button class="bigbtn" onclick="go('practice');startWriting()">
    <span class="ic lv">✏️</span><span class="txt" id="b-write"></span><span class="go">›</span>
  </button>
  <button class="bigbtn" onclick="go('diary')">
    <span class="ic mt">📔</span><span class="txt" id="b-diary"></span><span class="go">›</span>
  </button>
  <p class="tip" id="tip"></p>
</section>

<!-- ============ 練習 ============ -->
<section id="practice">
  <div id="practice-menu">
    <div class="top"><h1 id="pr-title"></h1><button class="ptbtn" onclick="togglePt()">🇧🇷</button></div>
    <p class="muted" id="pr-sub"></p>
    <button class="bigbtn" onclick="startParticles()">
      <span class="ic pk">🎀</span><span class="txt" id="m-part"></span><span class="go">›</span>
    </button>
    <button class="bigbtn" onclick="startWriting()">
      <span class="ic lv">✏️</span><span class="txt" id="m-write"></span><span class="go">›</span>
    </button>
    <button class="bigbtn" onclick="openNote()">
      <span class="ic mt">📒</span><span class="txt" id="m-note"></span><span class="go">›</span>
    </button>
  </div>
  <div id="practice-run" style="display:none"></div>
</section>

<!-- ============ 日記 ============ -->
<section id="diary">
  <div class="top"><h1 id="d-title"></h1><span class="row" style="gap:8px"><button class="fbtn" onclick="toggleFuri()" aria-label="Furigana">あ</button><button class="ptbtn" onclick="togglePt()">🇧🇷</button></span></div>
  <p class="muted" id="d-sub"></p>
  <div class="card">
    <div class="explain" style="margin:0 0 4px">
      <div class="hd" id="d-q-h"></div>
      <div id="d-q" style="font-size:17px"></div>
      <button class="linkbtn" onclick="nextDiaryQ()" id="d-q-next"></button>
    </div>
    <label for="d-jp" id="d-l1"></label>
    <textarea id="d-jp" rows="4" placeholder="今日は仕事が忙しかったです。"></textarea>
    <label for="d-pt" id="d-l2"></label>
    <textarea id="d-pt" rows="2" placeholder="Hoje o trabalho foi corrido."></textarea>
    <p class="muted small" style="margin-top:10px" id="d-tip"></p>
    <button class="block" style="margin-top:12px" onclick="submitDiary()" id="d-send"></button>
  </div>
  <h3 id="d-h-prev"></h3>
  <div class="card" id="diary-list"></div>
</section>

<!-- ============ ご褒美 ============ -->
<section id="prizes">
  <div class="top"><h1 id="z-title"></h1><button class="ptbtn" onclick="togglePt()">🇧🇷</button></div>
  <div class="card row" style="justify-content:space-between">
    <div><div class="muted" id="z-have"></div><div style="font-size:34px;font-weight:900" id="p-balance">0</div></div>
    <div style="font-size:46px">🎁</div>
  </div>
  <div class="card" id="prize-list"></div>
  <div id="redeem-wrap"><h3 id="z-h-done"></h3><div class="card" id="redeem-list"></div></div>
</section>

<!-- ============ 成長 ============ -->
<section id="progress">
  <div class="top"><h1 id="g-title"></h1><button class="ptbtn" onclick="togglePt()">🇧🇷</button></div>
  <div class="card">
    <div class="top"><b id="lv-big" style="font-size:20px"></b><span class="muted small" id="lv-next"></span></div>
    <div class="bar" style="margin-top:10px"><div id="lv-bar" style="width:0"></div></div>
    <div class="muted small" style="margin-top:8px" id="lv-path"></div>
  </div>
  <div class="grid2">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l" id="s-total-l"></div></div>
    <div class="stat"><div class="n" id="s-best">0</div><div class="l" id="s-best-l"></div></div>
    <div class="stat"><div class="n" id="s-sent">0</div><div class="l" id="s-sent-l"></div></div>
    <div class="stat"><div class="n" id="s-diary">0</div><div class="l" id="s-diary-l"></div></div>
  </div>
  <h3 id="g-h-cal"></h3>
  <div class="card"><div class="heat" id="heat"></div><p class="muted small" style="margin-top:10px" id="g-cal-l"></p></div>
  <h3 id="g-h-part"></h3>
  <div class="card" id="pstats"></div>
  <h3 id="g-h-write"></h3>
  <div class="card" id="wstats"></div>
  <h3 id="g-h-set"></h3>
  <div class="card">
    <button class="ghost block" onclick="manualReport()" id="g-report"></button>
    <p class="muted small" id="outbox-status" style="margin:8px 4px 0"></p>
    <div class="grid2" style="margin-top:12px">
      <button class="ghost" onclick="exportData()" id="g-backup"></button>
      <button class="ghost" onclick="document.getElementById('imp').click()" id="g-restore"></button>
    </div>
    <input type="file" id="imp" accept=".json,application/json,text/plain" style="display:none" onchange="importData(this)">
  </div>
</section>

</main>

/* ふりがなを つける。タグと、すでに ふりがなが ついた ところは そのまま。 */
function furi(s){ return String(s).split(/(<ruby>.*?<\/ruby>|<[^>]*>)/).map((p, i) => i % 2 ? p : furiTokens(p).map(([b, r]) => r ? `<ruby>${b}<rt>${r}</rt></ruby>` : b).join("")).join(""); }
/* 「3日」の よみ（ふつか・みっか…）。日数は 文脈で 読みが 変わるので、ここで まとめて つける。 */
const DAYR = {2:"ふつか",3:"みっか",4:"よっか",5:"いつか",6:"むいか",7:"なのか",8:"ようか",9:"ここのか",10:"とおか",14:"じゅうよっか",20:"はつか",24:"にじゅうよっか"};
const dayR = n => DAYR[n] ? `<ruby>${n}日<rt>${DAYR[n]}</rt></ruby>` : `${n}<ruby>日<rt>にち</rt></ruby>`;
/* 作文の くらべ用：よみ（ひらがな）に して、空白や 「。、」などを とる */
/* 数字を漢数字に（7 → 七、10 → 十、25 → 二十五）。「7時」と打っても「七時」と同じ よみで くらべられる。 */
function kanjiNum(n){
  const D = "〇一二三四五六七八九"; n = Number(n);
  if(!(n >= 0 && n < 10000)) return null; if(n === 0) return "〇";
  return [[1000,"千"],[100,"百"],[10,"十"],[1,""]].map(([u, k]) => { const x = Math.floor(n / u) % 10; return !x ? "" : (x === 1 && k ? "" : D[x]) + k; }).join("");
}
function norm(s){
  s = String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\d+/g, m => kanjiNum(m) || m);
  s = s.replace(/([一-鿿])（([ぁ-んー]+)）/g, "$2");
  s = furiTokens(s).map(([b, r]) => r || b).join("");
  return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/[\s　、。，．,.!！?？「」『』・〜~…]/g, "");
}
/* 2つの文の おなじ ところ（いちばん長い 共通部分）を しらべる */
function lcsMask(a, b){
  const n = a.length, m = b.length, dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ma = new Array(n).fill(false), mb = new Array(m).fill(false);
  for(let i = 0, j = 0; i < n && j < m;){ if(a[i] === b[j]){ ma[i] = mb[j] = true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  return {len:dp[0][0], ma, mb};
}
const markDiff = (s, mask, cls) => [...s].map((c, i) => mask[i] ? esc(c) : `<span class="${cls}">${esc(c)}</span>`).join("");
function furiTokens(s){
  const out = [];
  for(let i = 0; i < s.length;){
    let hit = null;
    if(isKanji(s[i])) for(const e of FURI){
      if(!s.startsWith(e.b, i)) continue;
      const nx = s[i + e.b.length] || "", pv = i > 0 ? s[i-1] : "";
      if(/^（[ぁ-んー]+）/.test(s.slice(i + e.b.length, i + e.b.length + 10))) continue;   // 文の中に読みが書いてある
      if(e.next && !(nx && e.next.includes(nx))) continue;
      if(e.prev && !(pv && e.prev.includes(pv))) continue;
      hit = e; break;
    }
    if(hit){ out.push([hit.b, hit.r]); i += hit.b.length; }
    else out.push([s[i++], null]);
  }
  return out;
}

const KEY = "kotonoha-v1";
function blank(){ return {total:0,balance:0,days:{},rest:{},restWeeks:{},weeklyBonus:{},pstats:{},partStats:{},tstats:{},writings:[],diaries:[],redemptions:[],bestStreak:0,outbox:[],showPt:false,furi:false}; }

   キー kotonoha-v1 の形は変えない。予備は別のキーに置く。 */
const BAK = KEY + "-bak";
function load(){
  let raw = null; try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{ const s = JSON.parse(raw); if(s && typeof s === "object"){ keepBackup(raw); return Object.assign(blank(), s); } }catch(e){}
    try{ localStorage.setItem(KEY + "-broken", raw); }catch(e){}
  }
  try{ const b = JSON.parse(localStorage.getItem(BAK)); if(b && b.s){ const s = JSON.parse(b.s); if(s && typeof s === "object") return Object.assign(blank(), s); } }catch(e){}
  return blank();
}
function keepBackup(raw){
  try{ const stamp = new Date().toDateString(); const b = JSON.parse(localStorage.getItem(BAK) || "null");
    if(b && b.d === stamp) return; localStorage.setItem(BAK, JSON.stringify({d:stamp, s:raw})); }catch(e){}
}

const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => ymd(new Date());
const parseKey = k => new Date(k+"T00:00:00");
function weekKey(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return ymd(x); }
function day(k){ k = k || todayKey(); if(!S.days[k]) S.days[k] = {pts:0,pc:0,pw:0,pwq:[],tr:[],diary:0,goalMet:false}; return S.days[k]; }
/* きょうの日課の進みぐあい（助詞・作文・日記） */
function quest(d){
  const q = CONFIG.daily;
  const items = [
    {k:"p", n:Math.min(d.pc + d.pw, q.particles), of:q.particles},
    {k:"w", n:Math.min(d.tr.length, q.writing), of:q.writing},
    {k:"d", n:Math.min(d.diary, q.diary), of:q.diary}
  ].filter(x => x.of > 0);
  const done = items.filter(x => x.n >= x.of).length;
  return {items, done, total:items.length, all:items.length > 0 && done === items.length,
    frac:items.length ? items.reduce((s, x) => s + x.n / x.of, 0) / items.length : 0, by:k => items.find(x => x.k === k)};
}
const counted = k => !!((S.days[k] && S.days[k].goalMet) || S.rest[k]);
function streak(){ let d = new Date(); if(!counted(ymd(d))) d = addDays(d,-1); let n = 0; while(counted(ymd(d))){ n++; d = addDays(d,-1); } return n; }
function levelInfo(t){ let L = 1, base = 0, need = 100; while(t >= base+need){ base += need; L++; need = 100*L; } return {L, into:t-base, need}; }
const lvMeta = L => LEVELS[Math.min(L, LEVELS.length) - 1];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function pickWeighted(arr, wf, n){
  const pool = arr.map(x => ({x, w:wf(x)})); const out = [];
  while(out.length < n && pool.length){
    const tot = pool.reduce((s,p) => s+p.w, 0); let r = Math.random()*tot, i = 0;
    for(; i < pool.length-1; i++){ r -= pool[i].w; if(r <= 0) break; }
    out.push(pool[i].x); pool.splice(i,1);
  }
  return out;
}

function sendMail(m, opt){
  if(!CONFIG.scriptUrl) return;
  S.outbox.push({id:Date.now().toString(36) + Math.random().toString(36).slice(2,8), subject:m.subject, body:m.body, ts:Date.now(), snap:!!(opt && opt.snap)});

/* レポートの下につけるバックアップ（送る瞬間の最新データ） */
/* GAS は本文を 200,000字で切るので、データが増えると（1年で約30万字）バックアップが途中で切れて戻せなくなる。
   そこで gzip で圧縮して「KTZ1:」＋base64 の1行にする（1年分でも数万字）。圧縮できない端末では、そのままの JSON。 */
const ZTAG = "KTZ1:";
async function packSnap(){
  const json = JSON.stringify(snapshot());
  if(typeof CompressionStream === "undefined") return json;
  try{
    const buf = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
    let bin = ""; for(let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return ZTAG + btoa(bin);
  }catch(e){ return json; }
}
/* 戻すときに読む：圧縮した1行（KTZ1:…）でも、ふつうの JSON でもよい */
async function unpackSnap(text){
  text = String(text).trim();
  const at = text.indexOf(ZTAG);
  if(at < 0) return text;
  const bin = atob(text.slice(at + ZTAG.length).replace(/[^A-Za-z0-9+/=]/g, ""));
  const buf = Uint8Array.from(bin, c => c.charCodeAt(0));
  return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
async function backupText(){
  return "\n\n――――――――――――\n💾 バックアップ（読まなくてOK）\nデータが消えたときは、下の1行（KTZ1: から最後まで）を kotonoha.json という名前で保存して彼女に送り、「成長 → 戻す」で選んでもらいます。\n" + await packSnap();
}
/* サーバーが「ok」と返したときだけ、送信待ちから消す。失敗したら残して、あとでもう一度送る。 */
let flushing = false;
async function flush(){
  if(flushing || !CONFIG.scriptUrl || !S.outbox.length || !navigator.onLine) return;
  flushing = true;
  let sent = 0;
  try{
    while(S.outbox.length){
      const it = S.outbox[0]; let ok = false;
      try{
        const body = it.body + (it.snap ? await backupText() : "");
        const res = await fetch(CONFIG.scriptUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify({token:CONFIG.token, id:it.id || String(it.ts), subject:it.subject, body, replyTo:CONFIG.studentEmail})});
        const txt = (await res.text()).trim();
        ok = res.ok && (txt === "ok" || txt === "dup");
      }catch(e){}
      if(!ok) break;
      if(S.outbox[0] === it) S.outbox.shift();
      save(); sent++;
    }
  } finally { flushing = false; }
  if(sent) refresh();
}
window.addEventListener("online", flush);

  L.push("", `■ 作文：${d.tr.length}文`);

    L.push(`  「${q.pt}」`, `    彼女の答え：${t.ans}`, `    模範解答：${q.a[0]}`, t.auto ? "    自動判定：◎ 模範解答と一致" : `    自己評価：${GRADE[t.grade]}`);

/* ---------- ふくしゅうの間隔（日付で管理） ----------
   問題ごとに box（0〜6）と due（つぎに出す日）を pstats / tstats に足す（もとの形はそのまま、項目を足すだけ）。
   せいかい → box が1つ上がり、出る間隔がのびる（その日・1日・3日・7日・14日・30日・60日）。まちがい → box 0。 */
const GAPS = [0, 1, 3, 7, 14, 30, 60];
function srsSet(s, box){ s.box = Math.max(0, Math.min(GAPS.length - 1, box)); s.due = ymd(addDays(new Date(), GAPS[s.box])); }
function srsWeight(s, legacy){
  if(!s) return 2;                       // まだ 出ていない問題
  if(s.due === undefined) return legacy;  // 前の版で 答えた問題（日付がまだない）
  if(s.due <= todayKey()) return s.box === 0 ? 8 : 6;
  return 0.2;                             // まだ 出す日では ない
}

/* ---------- 助詞 ---------- */
let P = null;
function startParticles(){
  const qs = pickWeighted(PQ, q => { const s = S.pstats[q.id]; return srsWeight(s, s ? Math.max(1, 1 + 2*s.w - 0.5*s.c) + 2 : 0); }, CONFIG.particlesPerSession);
  P = {qs, i:0, res:[], earned:0, main:qs.length, wrong:[], retried:false};
  $("practice-menu").style.display = "none"; $("practice-run").style.display = "";
  renderP();
}
function dots(res, n, i){ let h = '<div class="progress-dots">'; for(let k=0;k<n;k++){ h += `<span class="${res[k]===true?"ok":res[k]===false?"ng":k===i?"cur":""}"></span>`; } return h + "</div>"; }
function renderP(){
  const q = P.qs[P.i], retry = P.i >= P.main, ri = P.i - P.main, rn = P.qs.length - P.main;
  $("practice-run").innerHTML = `
    <div class="top"><button class="ghost" onclick="go('practice')">✕</button><span class="muted">${retry ? `🔁 ${ri+1} / ${rn}` : `${P.i+1} / ${P.main}`}</span>${topBtns()}</div>
    <div class="card">${retry ? dots(P.res.slice(P.main), rn, ri) : dots(P.res, P.main, P.i)}
      ${retry ? `<div class="explain" style="margin:0 0 10px">${T("🔁 間違えた問題をもう一度！（ポイントはつかないよ）","Vamos tentar de novo as que você errou! (sem pontos)")}</div>` : ""}
      <div class="muted small">${T("＿に入る助詞は？","Qual partícula completa a frase?")}</div>
      <div class="sentence">${furi(esc(q.jp)).replace("＿", '<span class="blank" id="blank">？</span>')}</div>
      <button class="linkbtn" id="m-btn" onclick="this.style.display='none';$('meaning').style.display='block'">${T("意味を見る","ver o significado")}</button>
      <div class="meaning" id="meaning" style="display:none">🇧🇷 ${esc(q.pt)}</div>
      <div class="opts">${shuffle(q.o).map(o => `<button onclick="answerP(this,'${o}')">${o}</button>`).join("")}</div>
      <div id="p-after"></div>
    </div>${tipLine()}`;
  applyPt();
}
function answerP(btn, o){
  const q = P.qs[P.i], ok = o === q.a, retry = P.i >= P.main;
  document.querySelectorAll(".opts button").forEach(b => { b.disabled = true; if(b.textContent === q.a) b.classList.add("right"); });
  if(!ok) btn.classList.add("wrong");
  const bl = $("blank"); bl.textContent = q.a; bl.classList.add("ok");
  P.res[P.i] = ok;
  if(!retry){   // もう一度の ときは、きろく・ポイント・日課に 入れない
    const s = S.pstats[q.id] || (S.pstats[q.id] = {c:0,w:0}); ok ? s.c++ : s.w++;
    const prev = s.box !== undefined ? s.box : Math.max(0, Math.min(2, s.c - s.w - (ok ? 1 : 0)));
    srsSet(s, ok ? prev + 1 : 0);
    const ps = S.partStats[q.a] || (S.partStats[q.a] = {c:0,w:0}); ok ? ps.c++ : ps.w++;
    const d = day(); ok ? d.pc++ : (d.pw++, d.pwq.push({id:q.id, chose:o}));
    if(!ok) P.wrong.push({q, chose:o});
    const pts = ok ? CONFIG.points.particleRight : CONFIG.points.particleWrong; P.earned += pts;
    addPoints(pts);
  } else save();
  const willRetry = !retry && P.i + 1 === P.main && P.wrong.length && !P.retried;
  $("p-after").innerHTML = `${canSpeak ? `<button class="spk wide" onclick="speakP()">${T("🔊 聞く","Ouvir a frase")}</button>` : ""}
    <div class="explain"><div class="hd">${ok ? T("🌸 正解！","Certo!") : T(`🌧️ おしい！答えは「${q.a}」`, `Quase! A resposta é ${q.a}`)}</div>${T(furi(esc(q.exj)), esc(q.ex), true)}</div>
    <button class="block" style="margin-top:12px" onclick="nextP()">${P.i+1 < P.qs.length ? T("次へ →","Próxima")
      : willRetry ? T("間違えた問題をもう一度 →","Tentar de novo as que errei") : T("結果を見る","Ver resultado")}</button>`;
  $("meaning").style.display = "block"; $("m-btn").style.display = "none";
  applyPt();
}
function nextP(){
  P.i++;
  if(P.i === P.main && P.wrong.length && !P.retried){ P.retried = true; P.qs = P.qs.concat(P.wrong.map(w => w.q)); }
  if(P.i < P.qs.length){ renderP(); return; }
  const n = P.main, right = P.res.slice(0, n).filter(Boolean).length;
  if(right >= n * 0.8) sparkles();
  const list = P.wrong.map(w => `<div class="item"><div class="jpx">${furi(esc(w.q.jp)).replace("＿", `<span class="blank ok">${w.q.a}</span>`)}</div>
      <div class="muted small">${T(`あなたの答え：「${w.chose}」→ 正しくは「${w.q.a}」`, `Você escolheu ${w.chose}; o certo é ${w.q.a}.`)}</div></div>`).join("");
  $("practice-run").innerHTML = `<div class="card" style="text-align:center">
      <div style="font-size:52px">${right >= n * 0.8 ? "🌟" : right >= n * 0.5 ? "🌷" : "🌱"}</div>
      <h2>${T(`${n}問中 ${right}問正解`, `${right} de ${n} certas`)}</h2>
      <p>${T(`<b>${P.earned}</b> ポイント ゲット！`, `Você ganhou ${P.earned} pontos.`)}</p>
      ${list ? `<div style="text-align:left;margin-top:14px"><div class="muted small" style="font-weight:700">${T("間違えた問題","As que você errou")}</div>${list}</div>` : ""}
      <p class="muted">${T("間違えた問題は、覚えるまでまた出るよ。","As que você errou vão aparecer de novo até você aprender.")}</p>
      <div class="grid2" style="margin-top:16px"><button class="ghost" onclick="go('home')">${T("ホーム","Início")}</button><button onclick="startParticles()">${T("もう10問","Mais 10")}</button></div>
    </div>`;
  applyPt();
}

/* ---------- 作文 ---------- */
let W = null;
function startWriting(){
  const qs = pickWeighted(TR, q => { const s = S.tstats[q.id]; return srsWeight(s, s ? ({3:1, 2:2.5, 1:4}[s.grade] || 3) + 1 : 0); }, CONFIG.writingPerSession);
  W = {qs, i:0, earned:0};
  $("practice-menu").style.display = "none"; $("practice-run").style.display = "";
  renderW();
}
function renderW(){
  const q = W.qs[W.i];
  $("practice-run").innerHTML = `
    <div class="top"><button class="ghost" onclick="go('practice')">✕</button><span class="muted">${W.i+1} / ${W.qs.length}</span>${topBtns()}</div>
    <div class="card">
      <div class="muted">${T("この文を日本語で書いてね","Escreva esta frase em japonês")}</div>
      <div class="pt-prompt">${esc(q.pt)}</div>
      <button class="soft" id="hint-btn" onclick="showHint()">💡 ${T("ヒント","Dica")}</button><div id="hint-box"></div>
      <label for="w-ans">${T("あなたの答え","Sua resposta")}</label>
      <textarea id="w-ans" rows="2" placeholder="ここに日本語で…" oninput="$('w-show').disabled = this.value.trim().length < 2"></textarea>
      <button class="block" id="w-show" style="margin-top:12px" disabled onclick="showW()">${T("答えを見る","Ver resposta")}</button>
      <div id="w-after"></div>
    </div>${tipLine()}`;
  applyPt();
}
function showHint(){ const q = W.qs[W.i]; $("hint-btn").style.display = "none"; $("hint-box").innerHTML = `<div class="explain">💡 ${T(furi(esc(q.h)), esc(q.hp), true)}</div>`; applyPt(); }
/* よみを ならべて、ちがう ところに 色を つける */
function cmpHtml(na, cands){
  const best = cands.map(n => ({n, m:lcsMask(na, n)})).map(x => ({...x, r:2 * x.m.len / (na.length + x.n.length || 1)})).sort((a, b) => b.r - a.r)[0];
  if(!best || best.r < 0.4) return "";
  return `
    <label>${T("読みで比べると","Comparando a leitura")}</label>
    <div class="yours kana">${markDiff(na, best.m.ma, "df-ng")}</div>
    <div class="model kana">${markDiff(best.n, best.m.mb, "df-add")}</div>
    <p class="muted small">${T('<span class="df-ng">ピンク</span>＝違うところ・<span class="df-add">緑</span>＝足りないところ',"Rosa = diferente · verde = faltou")}</p>`;
}
const modelsHtml = q => q.a.map((a, i) => `<div class="model">${furi(esc(a))}${canSpeak ? `<button class="spk" onclick="speakW(${i})" aria-label="Ouvir">🔊</button>` : ""}</div>`).join("");
function showW(){
  const q = W.qs[W.i], ans = $("w-ans").value.trim();
  $("w-ans").disabled = true; $("w-show").style.display = "none";
  // よみ（ひらがな）に そろえて くらべる。漢字でも ひらがなでも、答えの例と おなじなら「ぴったり」。
  const na = norm(ans), cands = q.a.map(norm);
  const exact = na.length > 0 && cands.includes(na);
  const cmp = exact ? "" : cmpHtml(na, cands);
  $("w-after").innerHTML = `
    <label>${T("あなたが書いた文","Você escreveu")}</label><div class="yours">${esc(ans)}</div>
    <label>${T("答えの例","Exemplo de resposta")}</label>${modelsHtml(q)}
    ${exact ? `<div class="explain" style="background:var(--mint-s)"><div class="hd">${T("🌸 ぴったり！","Perfeito!")}</div>${T("答えの例と同じだよ。","Igual ao exemplo de resposta.")}</div>
    <button class="block" style="margin-top:12px" onclick="gradeW(3,true)">${T("次へ →","Próxima")}</button>` : `${cmp}
    <p class="muted small">${T("同じでなくても大丈夫。他の言い方もあるよ。ジャスも見てくれるよ。","Não precisa ser igual: outras formas podem estar certas. O Jas também vai ver.")}</p>
    <p style="margin-top:12px;font-weight:900">${T("どうだった？","Como foi?")}</p>
    <div class="grades">
      <button class="g3" onclick="gradeW(3)">${T("◎ できた","Acertei")}</button>
      <button class="g2" onclick="gradeW(2)">${T("○ おしい","Quase")}</button>
      <button class="g1" onclick="gradeW(1)">${T("△ 間違えた","Errei")}</button>
    </div>`}`;
  applyPt();
}
function gradeW(g, auto){
  const q = W.qs[W.i], ans = $("w-ans").value.trim();
  const old = S.tstats[q.id] || {}, prev = old.box !== undefined ? old.box : (old.grade === 3 ? 1 : 0);
  const s = {grade:g, n:(old.n || 0) + 1}; srsSet(s, g === 3 ? prev + 1 : g === 2 ? Math.min(prev, 1) : 0);
  S.tstats[q.id] = s;
  const rec = {id:q.id, ans, grade:g}; if(auto) rec.auto = true;
  const wrec = Object.assign({date:todayKey()}, rec);
  day().tr.push(rec); S.writings.push(wrec);
  W.recs = [rec, wrec]; W.pend = true; save();
  // ○・△ の ときは、答えの例を 見ないで もう一度書く（ポイントは そのあとで 入る）
  if(!auto && g < 3) renderRedo(); else doneW();
}
/* 書いた 文の ポイントを 入れる（書きなおしの とちゅうで やめても 入る） */
function settleW(){
  if(!W || !W.pend) return;
  W.pend = false; W.earned += CONFIG.points.writing;
  addPoints(CONFIG.points.writing);
}
function renderRedo(){
  const q = W.qs[W.i];
  $("practice-run").innerHTML = `
    <div class="top"><button class="ghost" onclick="go('practice')">✕</button><span class="muted">${W.i+1} / ${W.qs.length}</span>${topBtns()}</div>
    <div class="card">
      <div class="explain" style="margin:0 0 10px">${T("✍️ 答えの例を見ないで、もう一度書いてみよう。書けたらジャスにも伝わるよ。","Agora escreva de novo, sem olhar o exemplo. Se conseguir, o Jas fica sabendo.")}</div>
      <div class="pt-prompt">${esc(q.pt)}</div>
      <button class="soft" id="peek-btn" onclick="const b=$('peek-box');b.style.display=b.style.display?'':'none'">👀 ${T("答えの例をちょっと見る","Espiar o exemplo")}</button>
      <div id="peek-box" style="display:none">${modelsHtml(q)}</div>
      <label for="r-ans">${T("もう一度書く","Escreva de novo")}</label>
      <textarea id="r-ans" rows="2" placeholder="ここに日本語で…" oninput="$('r-check').disabled = this.value.trim().length < 2"></textarea>
      <button class="block" id="r-check" style="margin-top:12px" disabled onclick="checkRedo()">${T("確かめる","Conferir")}</button>
      <div id="r-after"></div>
      <button class="linkbtn" id="r-skip" style="display:block;margin:12px auto 0" onclick="doneW()">${T("飛ばして次へ","Pular e continuar")}</button>
    </div>${tipLine()}`;
  applyPt();
}
function checkRedo(){
  const q = W.qs[W.i], na = norm($("r-ans").value), cands = q.a.map(norm);
  if(na && cands.includes(na)){
    W.recs.forEach(r => r.re = true); save();
    $("r-ans").disabled = true; ["r-check","r-skip","peek-btn"].forEach(id => $(id).style.display = "none");
    $("peek-box").style.display = "";
    $("r-after").innerHTML = `<div class="explain" style="background:var(--mint-s)"><div class="hd">${T("🌸 書けた！","Conseguiu!")}</div>${T("答えの例と同じだよ。","Igual ao exemplo de resposta.")}</div>
      <button class="block" style="margin-top:12px" onclick="doneW()">${T("次へ →","Próxima")}</button>`;
  } else {
    $("r-after").innerHTML = `${cmpHtml(na, cands)}<p class="muted small">${T("直して、もう一度「確かめる」を押してね。","Corrija e toque em “Conferir” de novo.")}</p>`;
  }
  applyPt();
}
function doneW(){
  settleW();
  W.i++;
  if(W.i < W.qs.length){ renderW(); return; }
  $("practice-run").innerHTML = `<div class="card" style="text-align:center">
      <div style="font-size:52px">✏️</div><h2>${T("よくできました！","Muito bem!")}</h2>
      <p>${T(`${W.qs.length}文書いて <b>${W.earned}</b> ポイント ゲット！`, `Você escreveu ${W.qs.length} frases e ganhou ${W.earned} pontos.`)}</p>
      <div class="grid2" style="margin-top:16px"><button class="ghost" onclick="go('home')">${T("ホーム","Início")}</button><button onclick="startWriting()">${T("もう3問","Mais 3")}</button></div>
    </div>`;
  applyPt();
}

/* ---------- 日記 ---------- */
function submitDiary(){
  const jp = $("d-jp").value.trim(), pt = $("d-pt").value.trim();
  if(jp.length < 6 || !/[ぁ-んァ-ヶ一-龥]/.test(jp)){ toast("もう少し書いてみよう 🙂"); return; }
  const d = day(), first = d.diary === 0;
  d.diary++;
  const dq = diaryQ();
  S.diaries.unshift({date:todayKey(), jp, pt, ts:Date.now(), q:dq[0]});
  save();
  sendMail({subject:`📓 ${CONFIG.studentNameMail} の日記（${todayKey()}）`,
    body:`${CONFIG.studentNameMail} が日記を書きました（${todayKey()}）\n\n【画面に出ていたお題（参考）】\n${dq[0]}\n\n【日本語】\n${jp}\n\n【言いたかったこと】\n${pt || "（記入なし）"}\n\n${CONFIG.studentEmail ? "このメールに返信すると、そのまま彼女に添削が届きます。" : ""}`});
  $("d-jp").value = ""; $("d-pt").value = ""; saveDraft();
  // 日記で目標達成になったときは、達成の画面を出す（「送ったよ」はトーストで伝える）
  const wasMet = d.goalMet;
  addPoints(first ? CONFIG.points.diaryFirst : CONFIG.points.diaryMore);
  if(!wasMet && d.goalMet){ setTimeout(() => toast("送ったよ ✉️"), 1400); return; }
  modal(`<div class="big">💌</div><h2>${T("送ったよ！","Enviado!")}</h2><p>${CONFIG.studentEmail ? T(`${CONFIG.teacherName}が読んで、メールで返事するね。`,"O Jas vai ler e responder por e-mail com as correções.") : T(`${CONFIG.teacherName}が読んで、返事するね。`,"O Jas vai ler e responder com as correções.")}</p><button class="block" onclick="closeModal()">OK</button>`);
  applyPt();
}
/* 日記の下書き（ほかのアプリに切りかえて iPhone が読みこみ直しても、書いた文が消えないように）。
   本体のキー（kotonoha-v1）には入れず、別のキーに置く。 */
const DRAFT = KEY + "-draft";
function saveDraft(){
  try{ const jp = $("d-jp").value, pt = $("d-pt").value;
    if(jp.trim() || pt.trim()) localStorage.setItem(DRAFT, JSON.stringify({jp, pt})); else localStorage.removeItem(DRAFT); }catch(e){}
}
function loadDraft(){
  try{ const d = JSON.parse(localStorage.getItem(DRAFT) || "null"); if(d){ $("d-jp").value = d.jp || ""; $("d-pt").value = d.pt || ""; } }catch(e){}
  ["d-jp","d-pt"].forEach(id => $(id).addEventListener("input", saveDraft));
}
/* きょうの お題（日替わり。「べつの おだい」で つぎへ） */
let dqShift = 0;
function diaryQ(){ const n = new Date(); return DIARY_Q[(n.getFullYear()*372 + n.getMonth()*31 + n.getDate() + dqShift) % DIARY_Q.length]; }
function nextDiaryQ(){ dqShift++; renderDiaryQ(); applyPt(); }
function renderDiaryQ(){ const q = diaryQ(); $("d-q").innerHTML = T(furi(esc(q[0])), esc(q[1]), true); }
function renderDiaryList(){
  renderDiaryQ();
  const el = $("diary-list");

  el.innerHTML = S.diaries.slice(0, 20).map(x => `<div class="item"><div class="muted small">${x.date}</div><div class="jpx">${esc(x.jp)}</div>${x.pt ? `<div class="muted small">${esc(x.pt)}</div>` : ""}</div>`).join("");

function askRedeem(id){

/* ---------- 成長 ---------- */
function renderProgress(){
  const lv = levelInfo(S.total), m = lvMeta(lv.L);
  $("lv-big").innerHTML = `${m[0]} Lv.${lv.L} ${furi(m[1])}`;
  $("lv-next").innerHTML = T(`次まであと ${lv.need - lv.into}`, `faltam ${lv.need - lv.into} pts`);
  $("lv-bar").style.width = Math.round(100*lv.into/lv.need) + "%";
  $("s-total").textContent = S.total;
  $("s-best").textContent = Math.max(S.bestStreak, streak());
  $("s-sent").textContent = S.writings.length + S.diaries.length;
  $("s-diary").textContent = S.diaries.length;
  const end = new Date(), start = addDays(parseKey(weekKey(end)), -7*11);
  let h = "";
  for(let i=0;i<84;i++){
    const dt = addDays(start, i), k = ymd(dt);
    if(dt > end){ h += '<div style="background:transparent"></div>'; continue; }
    const p = S.days[k] ? S.days[k].pts : 0, met = !!(S.days[k] && S.days[k].goalMet);
    const c = S.rest[k] && !met ? "hr" : met ? (p >= 60 ? "h3" : "h2") : p > 0 ? "h1" : "";
    h += `<div class="${c}" title="${k}: ${p}"></div>`;
  }
  $("heat").innerHTML = h;
  const parts = ["は","が","を","に","で","へ","と","や","か","も","の","から","まで","より","だけ","しか"];
  const rows = parts.filter(p => S.partStats[p]).map(p => { const s = S.partStats[p], n = s.c+s.w, pct = Math.round(100*s.c/n);
    return `<div class="pbar"><span class="k">${p}</span><div class="bar ${pct>=80?"g":""}"><div style="width:${pct}%"></div></div><span class="muted">${pct}% <span class="small">(${n})</span></span></div>`; });
  $("pstats").innerHTML = rows.length ? rows.join("") + `<p class="muted small">${T("緑 ＝ 80% 以上。（ ）は答えた数。","Verde = 80% ou mais. Entre parênteses: quantas vezes respondeu.")}</p>` + confHtml(3)
    : `<div class="empty"><div class="big">🎀</div>${T("助詞の練習をするとここに出るよ","Faça um exercício de partículas para ver aqui.")}</div>`;
  const seen = Object.keys(S.tstats).length, good = Object.values(S.tstats).filter(s => s.grade === 3).length;
  $("wstats").innerHTML = `<p>${T(`練習した文：<b>${seen} / ${TR.length}</b>`, "Frases diferentes já praticadas")}</p><p>${T(`最後に ◎ だった文：<b>${good}</b>`, "Marcadas como ◎ na última vez")}</p>
    <div class="bar g" style="margin-top:8px"><div style="width:${Math.round(100*good/TR.length)}%"></div></div>`;
  $("outbox-status").innerHTML = !CONFIG.scriptUrl ? T("メール：まだ設定されていません","E-mail: ainda não configurado.")
    : S.outbox.length ? T(`${S.outbox.length}件、インターネットにつながったら送るよ`, "Mensagens esperando internet para enviar.") : T("メールは全部送ったよ ✓","Todas as mensagens foram enviadas.");
}

/* ---------- ノート（見かえす） ---------- */
/* 助詞の とりちがえ：「ただしくは a」の ところで「c」を えらんだ 回数（days の pwq から 数える） */
function confusions(){
  const m = {};
  Object.values(S.days).forEach(d => (d.pwq || []).forEach(w => {
    const q = PQ.find(x => x.id === w.id); if(!q || !w.chose || w.chose === q.a) return;
    const k = q.a + "→" + w.chose; m[k] = (m[k] || 0) + 1; }));
  return Object.entries(m).map(([k, n]) => { const [a, c] = k.split("→"); return {a, c, n}; }).sort((x, y) => y.n - x.n);
}
function confHtml(max){
  const cf = confusions().slice(0, max); if(!cf.length) return "";
  return `<div class="muted small" style="font-weight:700;margin-top:12px">${T("よく取り違える助詞（✕ 選んだ → ○ 正しい）","Trocas mais comuns (✕ escolhida → ○ certa)")}</div>` + cf.map(x =>
    `<div class="item" style="padding:8px 0">${T(`✕「<b>${esc(x.c)}</b>」→ ○「<b class="hl">${esc(x.a)}</b>」 <span class="muted small">${x.n}回</span>`, `Você escolheu ${esc(x.c)}; o certo era ${esc(x.a)} (${x.n}×)`)}</div>`).join("");
}
function speakQ(id){ const q = PQ.find(x => x.id === id); if(q) speak(q.jp.replace("＿", q.a)); }
function speakT(id){ const q = TR.find(x => x.id === id); if(q) speak(q.a[0]); }
function speakR(i, j){ speak(RULES[i][1][j][2].replace(/[\[\]]/g, "")); }
const spkBtn = call => canSpeak ? `<button class="spk" onclick="${call}" aria-label="Ouvir">🔊</button>` : "";
let noteTab = "m";
function openNote(tab){
  if(tab) noteTab = tab;
  $("practice-menu").style.display = "none"; $("practice-run").style.display = "";
  const tabs = [["m","🌧️ 間違い","Erros"],["w","✏️ 書いた文","Frases"],["r","🎀 ルール","Regras"]];
  let body = "";
  if(noteTab === "m"){
    const bx = q => S.pstats[q.id].box || 0;
    const ms = PQ.filter(q => S.pstats[q.id] && S.pstats[q.id].w > 0).sort((a, b) => bx(a) - bx(b) || S.pstats[b.id].w - S.pstats[a.id].w).slice(0, 40);
    const cf = confHtml(5);
    body = (cf ? `<div class="card">${cf}</div>` : "") + `<div class="card">` + (ms.length ? `<p class="muted small">${T("間違えたことがある問題。文を押すと意味が出るよ。","Perguntas que você já errou. Toque na frase para ver o significado.")}</p>` + ms.map(q => { const s = S.pstats[q.id];
        return `<div class="item"><div class="jpx">${T(furi(esc(q.jp)).replace("＿", `<span class="blank ok">${q.a}</span>`), esc(q.pt), true)}${spkBtn(`speakQ('${q.id}')`)}</div>
          <div class="explain" style="margin-top:8px;font-size:14px">${T(furi(esc(q.exj)), esc(q.ex), true)}</div>
          <div class="muted small" style="margin-top:4px">✕ ${s.w}・○ ${s.c}${bx(q) >= 3 ? `・${T("🌸 覚えてきたよ","Você está aprendendo!")}` : ""}</div></div>`; }).join("")
      : `<div class="empty"><div class="big">🌸</div>${T("間違えた問題はまだないよ","Você ainda não errou nenhuma pergunta.")}</div>`) + `</div>`;
  } else if(noteTab === "w"){
    const ws = S.writings.slice(-40).reverse().map(w => { const q = TR.find(x => x.id === w.id); if(!q) return "";
      const g = w.auto ? T("🌸 ぴったり","Perfeito") : T(GRADE[w.grade] || "", {3:"Acertei", 2:"Quase", 1:"Errei"}[w.grade] || "");
      return `<div class="item"><div class="muted small">${esc(w.date)}・${g}${w.re ? `・${T("✍️ 書き直した","Reescrita")}` : ""}</div>
        <div class="meaning">🇧🇷 ${esc(q.pt)}</div><div class="yours">${esc(w.ans)}</div>
        <div class="model">${furi(esc(q.a[0]))}${spkBtn(`speakT('${q.id}')`)}</div></div>`; }).join("");
    body = `<div class="card">` + (ws ? `<p class="muted small">${T("紫 ＝ あなたが書いた文・緑 ＝ 答えの例","Lilás = o que você escreveu · verde = exemplo de resposta")}</p>` + ws
      : `<div class="empty"><div class="big">✏️</div>${T("作文をするとここに出るよ","Faça um exercício de escrita para ver aqui.")}</div>`) + `</div>`;
  } else {
    body = `<div class="card"><p class="muted small">${T("説明を押すとポルトガル語が出るよ。％ はあなたの正解率。","Toque na explicação para ver em português. % = seus acertos.")}</p>` + RULES.map((r, i) => { const s = S.partStats[r[0]];
      return `<div class="item row" style="align-items:flex-start"><div class="rule-k">${r[0]}${s ? `<div class="muted small" style="font-weight:500">${Math.round(100*s.c/(s.c+s.w))}%</div>` : ""}</div><div style="flex:1">` + r[1].map((u, j) =>
        `<div style="margin-bottom:10px"><div style="font-size:14px">${T(furi(esc(u[0])), esc(u[1]), true)}</div><div class="jpx">${furi(esc(u[2])).replace(/\[(.+?)\]/g, '<b class="hl">$1</b>')}${spkBtn(`speakR(${i},${j})`)}</div></div>`).join("") + `</div></div>`; }).join("") + `</div>`;
  }
  $("practice-run").innerHTML = `<div class="top"><button class="ghost" onclick="go('practice')">✕</button><b>📒 ノート</b>${topBtns()}</div>
    <div class="tabs">${tabs.map(t => `<button class="${t[0] === noteTab ? "on" : ""}" onclick="openNote('${t[0]}')">${T(t[1], t[2])}</button>`).join("")}</div>${body}${tipLine()}`;
  applyPt();
}

/* ---------- バックアップ ---------- */
async function exportData(){
  const name = `kotonoha-backup-${todayKey()}.json`, json = JSON.stringify(snapshot());
  // iPhone のホーム画面アプリではダウンロードが動かないことがあるので、まず「共有」をためす
  try{
    const f = new File([json], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], {type:"application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
let pendingImport = null;
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const s = JSON.parse(await unpackSnap(r.result)); if(!s || typeof s.total !== "number" || !s.days || typeof s.days !== "object") throw 0;
      pendingImport = s;
      const last = Object.keys(s.days).sort().pop() || "—";
      modal(`<div class="big">📦</div><h2>${T("このデータに戻す？","Restaurar estes dados?")}</h2>
        <p>${T(`ファイル：<b>${Number(s.total)}</b> ポイント（最後の日：${esc(last)}）`, `Arquivo: ${Number(s.total)} pontos (último dia: ${esc(last)})`)}</p>
        <p>${T(`今のデータ：<b>${S.total}</b> ポイント`, `Dados atuais: ${S.total} pontos`)}</p>
        <p class="muted small">${T("今のデータは、ファイルのデータに変わるよ。","Os dados atuais serão substituídos pelos do arquivo.")}</p>
        <div class="grid2" style="margin-top:14px"><button class="ghost" onclick="pendingImport=null;closeModal()">${T("やめる","Cancelar")}</button><button onclick="confirmImport()">${T("戻す","Restaurar")}</button></div>`);
      applyPt();
    }catch(e){ toast("ファイルが違うみたい"); }
  };
  r.readAsText(f); inp.value = "";
}
function confirmImport(){
  const s = pendingImport; pendingImport = null; closeModal();
  if(!s) return;
  try{ localStorage.setItem(KEY + "-before-restore", JSON.stringify(S)); }catch(e){}   // 上書きする前のデータを残す
  const box = S.outbox;                                                               // 送信待ちメールはそのまま
  S = Object.assign(blank(), s); S.outbox = box; furiDefault();
  save(); refresh(); toast("戻したよ ✓");
}

$("overlay").addEventListener("click", e => { if(e.target.id === "overlay") closeModal(); });
staticTexts();
loadDraft();
applyRestTicket();
catchUpReports();
refresh();
flush();
/* アプリを開いたままにして、あとで戻ってきたとき（iPhone は読みこみ直さないことが多い）にも、
   おやすみチケット・前の日のまとめ・メールの再送を行う */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  applyRestTicket(); catchUpReports(); refresh(); flush();
});
/* オフラインでも開けるようにする（sw.js）。保存データを端末が勝手に消さないように頼む。 */
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
