<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ことのは">
<meta name="theme-color" content="#fdeef5">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<title>ことのはの森 Kotonoha</title>
<style>
:root{
  --ink:#5b4a6b; --muted:#725f86; --line:#f1e3ee;
  /* 文字用の濃い色（パステルの背景の上でも読める：コントラスト4.5以上） */
  --pink-t:#b03a6e; --mint-t:#277a5c; --lav-t:#6c4fc0;
  --pink:#f49ac1; --pink-d:#e2689d; --pink-s:#ffe6f0;
  --lav:#b8a4f4; --lav-s:#efe9ff;
  --mint:#7fd3b6; --mint-d:#43a984; --mint-s:#e1f6ee;
  --butter:#ffd978; --butter-s:#fff5d6;
  --card:rgba(255,255,255,.92);
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--round);font-weight:500;font-size:16px;line-height:1.6;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.9) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 8%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 60% 40%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 30% 70%, rgba(255,255,255,.8) 0 2px, transparent 3px),
    radial-gradient(circle at 88% 82%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
    linear-gradient(170deg,#fde7f1 0%,#f1e8ff 45%,#e6f6f1 100%);
  background-size:220px 220px,260px 260px,300px 300px,240px 240px,280px 280px,100% 100%;
  background-attachment:fixed}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-size:21px;font-weight:900;margin:2px 0;letter-spacing:.04em}
h2{font-size:19px;font-weight:900;margin:4px 0 8px}
h3{font-size:15px;margin:22px 4px 8px;color:var(--pink-t);font-weight:900;letter-spacing:.08em}
h3::before{content:"✦ "}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
/* translation */
.tr .p{display:none;font-size:max(.88em,13px);color:var(--muted);font-weight:500;line-height:1.4;margin-top:1px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
body.showpt .tr .p,.tr.open .p{display:block}
.tr.tap{cursor:pointer}
/* layout */
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 6px 18px rgba(226,104,157,.10),0 1px 0 #fff inset;border:2px solid #fff}
.row{display:flex;gap:14px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;padding:12px 14px;border:2px solid #fff;box-shadow:0 4px 12px rgba(184,164,244,.15)}
.stat .n{font-size:24px;font-weight:900}
.stat .l{font-size:13px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* buttons */
button{font:inherit;font-weight:700;border:none;border-radius:999px;padding:12px 18px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#c2457a 0%,#7f5fd0 100%);box-shadow:0 4px 0 rgba(176,58,110,.25)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(226,104,157,.25)}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
button.soft{background:var(--butter-s);color:#8a6500;box-shadow:0 3px 0 #f3e2a9}
button:disabled{opacity:.45;cursor:default}
button.block{width:100%;display:block}
.ptbtn,.fbtn{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;background:#fff;box-shadow:0 3px 0 var(--line);border:2px solid var(--line);flex:none}
.ptbtn.on,.fbtn.on{background:var(--mint-s);border-color:var(--mint)}
.fbtn{color:var(--ink);font-size:18px;font-weight:900}
body:not(.furi) rt{display:none}
rt{font-size:max(.55em,9px);font-weight:500;color:var(--muted);letter-spacing:0}
/* ふりがなが漢字より長いときは、ことばの外側に少し間をあける（漢字と漢字の間は広げない：「練 習」にならないように）。
   ふりがなどうしが重ならないように、はみ出しはしない。 */
ruby{ruby-align:center}
rt{ruby-align:center}
.spk{padding:4px 12px;font-size:15px;background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line);border:2px solid var(--line);margin-left:6px;vertical-align:middle}
.spk.wide{margin:12px 0 0}
.df-ng{background:var(--pink-s);color:var(--pink-t);border-radius:4px;text-decoration:underline wavy}
.df-add{background:var(--mint-s);color:var(--mint-t);border-radius:4px;text-decoration:underline}
.kana{letter-spacing:.08em}
.bigbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:2px solid #fff;padding:14px 16px;margin:10px 0;border-radius:24px;box-shadow:0 5px 14px rgba(184,164,244,.18)}
.bigbtn .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.bigbtn b{display:block;font-size:17px;font-weight:900}
.bigbtn .go{font-size:24px;color:var(--pink)}
.bigbtn .txt{flex:1}
.ic.pk{background:var(--pink-s)}.ic.lv{background:var(--lav-s)}.ic.mt{background:var(--mint-s)}
.done{color:var(--mint-t);font-weight:900}
.dl{flex-basis:100%;text-align:center;font-size:15px;font-weight:700;color:var(--muted)}
.dl:empty{display:none}
.dl.hot{color:var(--pink-t);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.5}}
.cnt{display:block;font-size:14px;color:var(--muted);font-weight:700}
/* mascot */
.hero{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.mascot{width:96px;height:96px;flex:none;animation:bob 3s ease-in-out infinite;object-fit:contain;-webkit-user-select:none;user-select:none}
/* 絵（images/）。うさぎは Gemini で作った絵、背景は透明 */
.bimg{display:block;margin:0 auto;width:120px;height:120px;object-fit:contain;pointer-events:none}
.ic img{width:40px;height:40px;object-fit:contain}
/* 文の中の小さな絵（🔥🎫🎁🇧🇷 などの代わり） */
.ico{display:inline-block;height:1.3em;width:auto;vertical-align:-.3em;margin:0 .06em}
.ptbtn img{width:28px;height:28px;object-fit:contain;display:block;margin:auto}
.env img{width:120px;height:120px;object-fit:contain;display:block}
.cdimg{display:block;width:100%;height:auto;border-radius:16px;margin:8px 0 6px}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{position:relative;background:#fff;border-radius:20px;padding:10px 14px;margin-bottom:22px;box-shadow:0 4px 12px rgba(226,104,157,.12);font-weight:700;flex:1}
.bubble::after{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
nav .in{display:flex;max-width:500px;width:100%;background:rgba(255,255,255,.95);border-radius:28px;box-shadow:0 8px 24px rgba(184,164,244,.3);border:2px solid #fff;pointer-events:auto;padding:4px}
nav button{flex:1;background:none;box-shadow:none;color:var(--muted);border-radius:22px;padding:8px 2px 6px;font-size:11px}
nav button i{display:block;font-style:normal;font-size:21px;line-height:1.25}
nav button i img{display:block;width:30px;height:30px;margin:0 auto 1px;object-fit:contain}
nav button.on{background:var(--pink-s);color:var(--pink-t)}
section{display:none}
section.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
/* ring */
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:28px;font-weight:900;line-height:1.1}
.bar{height:12px;background:#f6eaf2;border-radius:8px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:8px;transition:width .5s}
.bar.g>div{background:linear-gradient(90deg,var(--mint),#a8e6cf)}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:900;background:var(--butter-s);color:#8a6500;border:2px solid #fff}
/* exercises */
.sentence{font-size:25px;font-weight:700;line-height:1.9;margin:8px 0 4px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:1.9em;text-align:center;border-radius:12px;background:var(--pink-s);color:var(--pink-t);margin:0 3px;padding:0 6px;line-height:1.5}
.blank.ok{background:var(--mint-s);color:var(--mint-t)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opts button{font-size:26px;padding:14px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px}
.opts button.right{background:var(--mint-s);border-color:var(--mint);color:var(--mint-t);box-shadow:0 4px 0 #bfe9d9}
.opts button.wrong{background:var(--pink-s);border-color:var(--pink);color:var(--pink-t);box-shadow:0 4px 0 #f8c9dc}
.explain{margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--lav-s);font-size:15px}
textarea,input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--pink)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 4px 4px;font-weight:700}
.model{font-size:20px;padding:10px 14px;background:var(--mint-s);border-radius:16px;margin:6px 0}
.yours{font-size:20px;padding:10px 14px;background:var(--lav-s);border-radius:16px;margin:6px 0}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grades button{padding:12px 4px;font-size:15px}
.g3{background:linear-gradient(135deg,#a8e6cf,#c9f0e1)!important;color:#1e6b4f!important}
.g2{background:linear-gradient(135deg,#ffcf6b,#ffe3a1)!important;color:#5b4300!important}
.g1{background:linear-gradient(135deg,#ffd0e3,#ffe6f0)!important;color:#a8306a!important}
.pt-prompt{font-size:21px;font-weight:900;margin:4px 0 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.meaning{font-size:15px;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.linkbtn{background:none;box-shadow:none;color:var(--lav-t);padding:4px 0;font-size:14px;text-decoration:underline}
.progress-dots{display:flex;gap:5px;margin-bottom:12px}
.progress-dots span{flex:1;height:8px;border-radius:5px;background:#f6eaf2}
.progress-dots span.ok{background:var(--mint)}.progress-dots span.ng{background:var(--pink)}.progress-dots span.cur{background:var(--lav)}
/* lists */
.item{padding:12px 0;border-bottom:2px dotted var(--line)}
.item:last-child{border-bottom:none}
.item .jpx{font-size:17px;white-space:pre-wrap}
.empty{text-align:center;padding:18px 6px}
.empty .big{font-size:44px}
/* 12週間のカレンダー：左に曜日、上に月。マスを押すと、その日のポイントが出る */
.heat{display:grid;grid-template-columns:20px repeat(12,19px);grid-auto-rows:19px;gap:4px;justify-content:start;overflow-x:auto;padding-top:2px}
.heat .hd{font-size:11px;line-height:19px;color:var(--muted);text-align:center;white-space:nowrap;font-weight:700}
.heat .mo{text-align:left;overflow:visible}
.heat .c{border-radius:5px;background:#f6eaf2;cursor:pointer}
.heat .c.fu{background:transparent;cursor:default}
.heat .c.today{outline:2px solid var(--pink-t);outline-offset:1px}
.h1{background:#fbd0e2!important}.h2{background:#f49ac1!important}.h3{background:#c77dd6!important}.hr{background:var(--butter-s)!important;outline:2px dashed var(--butter);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span.lg{display:inline-flex;align-items:center;gap:6px}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none}
.nw{white-space:nowrap}
.tag-jp{display:table;margin-top:4px;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--lav-s);color:var(--lav-t)}
.pbar{display:grid;grid-template-columns:2.4em 1fr 3.8em;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.pbar .k{font-size:19px;font-weight:900;text-align:center}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(91,74,107,.35);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:28px;padding:26px 22px;max-width:360px;width:100%;text-align:center;border:3px solid var(--pink-s);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal .big{font-size:54px;animation:bob 2s ease-in-out infinite}
.modal .surprise{color:#8a6500;font-weight:900}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-140%);background:#fff;color:var(--pink-t);padding:8px 18px;border-radius:999px;font-weight:900;transition:transform .25s;z-index:50;box-shadow:0 6px 16px rgba(226,104,157,.25);border:2px solid var(--pink-s)}
.toast.on{transform:translateX(-50%) translateY(0)}
.sparkle{position:fixed;pointer-events:none;z-index:40;font-size:20px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(60vh) rotate(200deg);opacity:0}}
/* 演出 */
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:45}
/* 手紙・チュートリアルなどの画面が出ているときは、花びらやハートを画面の後ろに回す（文字にかぶらないように） */
body.modal-on #fx{z-index:19}
.stamp{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:46;pointer-events:none;text-align:center;white-space:nowrap;animation:stamp 1.9s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp{padding:28px 40px;background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,255,255,.6) 60%,transparent)}
.stamp b{display:block;font-size:46px;font-weight:900;line-height:1.25;color:#ff4f9a;letter-spacing:.04em;
  text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 3px 0 #fff,0 7px 16px rgba(226,104,157,.55)}
.stamp b rt{color:#c77dd6;text-shadow:none}
.stamp small{display:inline-block;margin-top:6px;font-size:18px;font-weight:900;color:var(--pink-d);background:#fff;border-radius:999px;padding:4px 16px;box-shadow:0 4px 14px rgba(226,104,157,.3)}
.stamp.big b{font-size:58px}
.stamp.gold b{color:#f0a400;text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 3px 0 #fff,0 7px 16px rgba(255,190,40,.6)}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-62%) scale(.9);opacity:0}}
.floaty{position:fixed;z-index:46;pointer-events:none;font-weight:900;font-size:22px;color:var(--pink-d);white-space:nowrap;transform:translate(-50%,-50%);
  text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:floaty 1.1s ease-out forwards}
.floaty rt{color:var(--pink-d)}
@keyframes floaty{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}20%{transform:translate(-50%,-80%) scale(1.15);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.mascot{cursor:pointer}
.mascot.hop{animation:hop .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes hop{30%{transform:translateY(-26px) rotate(-8deg) scale(1.08)}60%{transform:translateY(0) rotate(4deg) scale(.96,1.04)}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bigbtn .tr .j{font-weight:500;color:var(--muted);font-size:14px}
button .tr .p{color:inherit;opacity:.95}
button rt{color:inherit;opacity:.85}
.opts button:disabled{opacity:1}
.explain .hd{font-weight:900;margin-bottom:6px}
.tip{font-size:14px;color:var(--muted);text-align:center;margin:10px 0 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tabs button{padding:10px 4px;font-size:14px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.tabs button.on{background:var(--pink-s);border-color:var(--pink);color:var(--pink-t)}
.hl{color:var(--pink-t);font-weight:900}
.rule-k{font-size:24px;font-weight:900;color:var(--pink-t);min-width:2.2em;text-align:center}
.item .model,.item .yours{font-size:17px}
/* 日本までのカウントダウン */
.cd{padding:14px 18px}
.rescue{text-align:center;background:linear-gradient(135deg,#fff5d6 0%,#ffe6f0 100%);border:2px solid #ffd978;animation:pop .4s ease-out}
.rescue .rq-ic{font-size:40px;line-height:1.1}
.rescue .rq-h{font-size:19px;font-weight:900;margin:4px 0}
.rescue .rq-btn{margin-top:10px;font-size:17px;padding:14px 18px;background:linear-gradient(135deg,#ffcf6b,#ffb3d1);color:#5b4a6b}
.tkbtn{background:none;box-shadow:none;border:none;padding:2px 0;color:var(--muted);font-size:13px;font-weight:700;text-align:left;cursor:pointer;text-decoration:underline dotted}
.tkbtn:active{transform:none}
.cd .cdn{font-size:30px;font-weight:900;color:var(--pink-t);margin:0 2px}
.cdtrack{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.cdtrack .fl{font-size:22px;flex:none}
.cdline{position:relative;flex:1;height:8px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.cdfill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--mint),var(--pink))}
.plane{position:absolute;top:50%;transform:translate(-50%,-58%);font-size:24px;animation:fly 2.4s ease-in-out infinite}
@keyframes fly{50%{transform:translate(-50%,-80%) rotate(-6deg)}}
/* 手紙 */
.mailnew{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;background:var(--pink-t);color:#fff;font-size:12px;font-weight:900;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.env{font-size:96px;line-height:1.1;cursor:pointer;display:inline-block;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.05)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.paper{text-align:left;background:repeating-linear-gradient(#fffdf8 0 31px,#f6e3ee 31px 32px);border:2px solid var(--pink-s);border-radius:18px;padding:16px 16px 10px;
  box-shadow:0 8px 22px rgba(226,104,157,.18);animation:unfold .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes unfold{from{transform:translateY(40px) scale(.85);opacity:0}}
.paper .pt{font-weight:900;color:var(--pink-t);margin-bottom:6px}
.paper .pj{font-size:18px;line-height:2.1}
.paper .pp{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:18px;padding:10px 12px;margin:8px 0;font-size:15px}
.mrow.lock{opacity:.6;background:#faf6fb;box-shadow:none;cursor:default}

.modal{max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow-y:auto}
.tut{text-align:left;margin:6px 0 4px}
.tut p{font-size:15px;margin:10px 0;padding:10px 12px;background:var(--lav-s);border-radius:16px}
.tut .tr .p{font-size:.85em}
.tdots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.tdots span{width:8px;height:8px;border-radius:50%;background:var(--line)}

</head>
<body>
<main>

<!-- ============ ホーム ============ -->
<section id="home" class="on">
  <div class="top">
    <div>
      <h1 id="hello"></h1>
    </div>
    <span class="row" style="gap:8px"><button class="fbtn" onclick="toggleFuri()" aria-label="Furigana">あ</button><button class="ptbtn" id="ptbtn" onclick="togglePt()" aria-label="Mostrar português"><img src="images/flag-br.webp" alt="" draggable="false" onerror="imgFail(this)"></button></span>

  </div>

  <div class="card cd" id="cd-card" style="display:none"></div>

  <div class="card rescue" id="rescue-card" style="display:none"></div>

        <circle id="ring-fg" cx="59" cy="59" r="49" stroke="#f49ac1" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="307.9" stroke-dashoffset="307.9" style="transition:stroke-dashoffset .6s"/></svg>
      <div class="c"><b id="today-pts">0</b><span class="muted small" id="today-goal"></span></div>

      <div class="muted" id="goal-sub"></div>
      <div style="margin-top:8px;font-weight:700" id="streak-line"></div>
      <div class="muted small" id="rest-status"></div>

  </div>

  <button class="stat row" style="width:100%;justify-content:space-between;color:var(--ink);text-align:left" onclick="go('prizes')">
    <span><span class="n" id="balance" style="display:block">0</span><span class="l" id="balance-l"></span></span><img src="images/gift.webp" alt="" style="width:46px;height:46px" draggable="false" onerror="imgFail(this)">

  <h3 id="h-today"></h3>
  <button class="bigbtn" onclick="go('practice');startParticles()">
    <span class="ic pk"><img src="images/icon-particles.webp" alt="" onerror="imgFail(this)"></span><span class="txt" id="b-part"></span><span class="go">›</span>
  </button>
  <button class="bigbtn" onclick="go('practice');startWriting()">

  </button>
  <button class="bigbtn" onclick="go('diary')">
    <span class="ic mt"><img src="images/icon-diary.webp" alt="" onerror="imgFail(this)"></span><span class="txt" id="b-diary"></span><span class="go">›</span>
  </button>
  <button class="bigbtn" onclick="openMailbox()">

</section>

<!-- ============ 練習 ============ -->
<section id="practice">

<!-- ============ 日記 ============ -->
<section id="diary">

  <div class="card" id="diary-list"></div>

<!-- ============ ご褒美 ============ -->

  <div class="card" id="prize-list"></div>
  <div id="redeem-wrap"><h3 id="z-h-done"></h3><div class="card" id="redeem-list"></div></div>
</section>

<!-- ============ 成長 ============ -->
<section id="progress">

  <div class="grid2">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l" id="s-total-l"></div></div>
    <div class="stat"><div class="n" id="s-best">0</div><div class="l" id="s-best-l"></div></div>
    <div class="stat"><div class="n" id="s-sent">0</div><div class="l" id="s-sent-l"></div></div>
    <div class="stat"><div class="n" id="s-diary">0</div><div class="l" id="s-diary-l"></div></div>
  </div>
  <h3 id="g-h-cal"></h3>
  <div class="card"><div class="heat" id="heat"></div><div class="legend" id="g-cal-l"></div></div>
  <h3 id="g-h-part"></h3>
  <div class="card" id="pstats"></div>
  <h3 id="g-h-write"></h3>
  <div class="card" id="wstats"></div>
  <h3 id="g-h-set"></h3>
  <div class="card">
    <button class="ghost block" onclick="tutorial(0)" id="g-tut" style="margin-bottom:12px"></button>
    <button class="ghost block" onclick="manualReport()" id="g-report"></button>
    <p class="muted small" id="outbox-status" style="margin:8px 4px 0"></p>

  </div>
</section>

</main>

  {id:"p26", jp:"スーパーへ買い物＿行きます。", pt:"Vou ao supermercado fazer compras.", a:"に", o:["に","を","で","が"], exj:"〈すること〉＋に＋行く ＝ 〜しに行く。", ex:"[atividade] に 行く = ir para fazer algo."},
  {id:"p27", jp:"肉＿野菜を買いました。", pt:"Comprei carne e legumes.", a:"と", o:["と","を","に","で"], exj:"物と物を並べる「と」：AとB。", ex:"と entre substantivos = “e”."},
  {id:"p28", jp:"私＿名前はレチシアです。", pt:"Meu nome é Letícia.", a:"の", o:["の","を","に","で"], exj:"「の」は言葉と言葉をつなぎます：私の名前。", ex:"の liga dois substantivos: わたしの名前 = o meu nome."},
  {id:"p29", jp:"日本語＿話してください。", pt:"Fale em japonês, por favor.", a:"で", o:["で","に","が","と"], exj:"何語で話すかも「で」：日本語で、ポルトガル語で。", ex:"で também indica a língua usada."},
  {id:"p30", jp:"私は今、一人＿住んでいます。", pt:"Agora eu moro sozinha.", a:"で", o:["で","に","を","が"], exj:"一人で・二人で ＝ どんな様子で。", ex:"一人で / 二人で = sozinha / nós dois."},
  {id:"p31", jp:"夏休み＿ブラジルに帰ります。", pt:"Nas férias de verão volto ao Brasil.", a:"に", o:["に","を","が","と"], exj:"「いつ？」の答えには「に」を使えます：夏休みに、誕生日に。", ex:"Para dizer quando (nas férias de verão, no aniversário), pode-se usar に."},
  {id:"p32", jp:"コーヒー＿紅茶のほうが好きです。", pt:"Gosto mais de chá preto do que de café.", a:"より", o:["より","から","まで","を"], exj:"「AよりBのほうが好き」＝ Aと比べてBが好き。", ex:"AよりBのほうが好き = gosto mais de B do que de A."},
  {id:"p33", jp:"駅＿歩いて十分です。", pt:"Até a estação são dez minutos a pé.", a:"まで", o:["まで","に","を","が"], exj:"「まで」＝ そこに着くまでの距離・時間。", ex:"まで = até (distância/tempo até um lugar)."},
  {id:"p34", jp:"車＿運転します。", pt:"Eu dirijo carro.", a:"を", o:["を","で","に","が"], exj:"運転するものは「を」。", ex:"O que você dirige é o objeto → を."},
  {id:"p35", jp:"新しい仕事＿見つかりました。", pt:"Encontrei um novo emprego.", a:"が", o:["が","を","に","で"], exj:"「見つかる」は「が」、「見つける」は「を」。", ex:"見つかる → が. 見つける → を."},
  {id:"p36", jp:"病院＿どこですか。", pt:"Onde fica o hospital?", a:"は", o:["は","を","に","で"], exj:"「〜はどこですか」：探している場所がテーマ。", ex:"[lugar] は どこですか: o lugar é o tópico."},
  {id:"p37", jp:"日本語の勉強＿楽しいです。", pt:"Estudar japonês é divertido.", a:"は", o:["は","を","に","で"], exj:"「は」でテーマを出して、そのあと説明。", ex:"は apresenta o assunto e depois vem o comentário."},
  {id:"p38", jp:"私は友達＿プレゼントをもらいました。", pt:"Eu ganhei um presente de uma amiga.", a:"に", o:["に","を","で","が"], exj:"「もらう」：くれた人は「に」（「から」も OK）。", ex:"もらう: quem deu leva に (ou から)."},
  {id:"p39", jp:"私はジャス＿プレゼントをあげました。", pt:"Eu dei um presente para o Jas.", a:"に", o:["に","を","で","が"], exj:"「あげる」：もらう人は「に」。", ex:"あげる: quem recebe leva に."},
  {id:"p40", jp:"駅の前＿待っています。", pt:"Estou esperando em frente à estação.", a:"で", o:["で","に","を","が"], exj:"「待つ」はすることなので「で」。", ex:"Esperar é uma ação → で."},
  {id:"p41", jp:"この電車は広島＿行きます。", pt:"Este trem vai para Hiroshima.", a:"に", o:["に","を","で","が"], exj:"「行く・来る・帰る」の行き先は「に」（「へ」も OK）。", ex:"Destino de 行く/来る/帰る leva に (ou へ)."},
  {id:"p42", jp:"日本料理＿作れます。", pt:"Sei fazer comida japonesa.", a:"が", o:["が","に","で","と"], exj:"「できる」の形（作れる・話せる）は「が」が普通。", ex:"Com a forma potencial, o objeto costuma levar が."},
  {id:"p43", jp:"体＿気をつけてね。", pt:"Cuide da saúde, tá?", a:"に", o:["に","を","で","が"], exj:"「気をつける」は「に」。", ex:"気をつける usa に."},
  {id:"p44", jp:"映画＿見に行きませんか。", pt:"Vamos ver um filme?", a:"を", o:["を","が","に","で"], exj:"映画は「見る」もの →「を」。", ex:"O filme é o objeto de 見る → を."},
  /* ---- 来日してからの場面（空港・買い物・病院・役所・仕事・家族）と、は／が・へ・や・か・だけ・しか ---- */
  {id:"p45", jp:"今、空港＿着きました。", pt:"Acabei de chegar ao aeroporto.", a:"に", o:["に","を","で","と"], exj:"「着く」ところは「に」。", ex:"Com 着く (chegar), o lugar leva に."},
  {id:"p46", jp:"パスポート＿見せてください。", pt:"Mostre o passaporte, por favor.", a:"を", o:["を","が","に","で"], exj:"見せるものは「を」。", ex:"O que você mostra é o objeto → を."},
  {id:"p47", jp:"私はブラジル＿来ました。", pt:"Eu vim do Brasil.", a:"から", o:["から","を","で","が"], exj:"「どこから来ましたか」→「〜から来ました」。", ex:"De onde você veio → [lugar] から 来ました."},
  {id:"p48", jp:"東京＿乗り換えます。", pt:"Faço baldeação em Tóquio.", a:"で", o:["で","を","が","と"], exj:"乗り換えは「すること」なので、場所は「で」。", ex:"Fazer baldeação é uma ação → o lugar leva で."},
  {id:"p49", jp:"タクシー＿乗ります。", pt:"Vou pegar um táxi.", a:"に", o:["に","を","で","と"], exj:"「乗る」は「に」：電車に乗る、バスに乗る。「を」は ×。", ex:"のる (pegar um veículo) usa に, não を."},
  {id:"p50", jp:"ここ＿座ってもいいですか。", pt:"Posso sentar aqui?", a:"に", o:["に","を","が","と"], exj:"「座る」ところは「に」。", ex:"O lugar onde você se senta leva に."},
  {id:"p51", jp:"これ＿ください。", pt:"Me dá este, por favor.", a:"を", o:["を","が","に","と"], exj:"ほしいものは「を」：これをください。", ex:"O que você pede leva を: これをください."},
  {id:"p52", jp:"カード＿払えますか。", pt:"Posso pagar com cartão?", a:"で", o:["で","に","と","へ"], exj:"払う方法は「で」：カードで、現金で。", ex:"O meio de pagamento leva で: com cartão, em dinheiro."},
  {id:"p53", jp:"全部＿いくらですか。", pt:"Quanto fica tudo junto?", a:"で", o:["で","を","に","と"], exj:"「全部で」＝ 合わせて。", ex:"ぜんぶで = no total, tudo junto."},
  {id:"p54", jp:"パン＿卵などを買いました。", pt:"Comprei pão, ovos e outras coisas.", a:"や", o:["や","を","に","で"], exj:"「AやB（など）」＝ AとBと、他にもある。", ex:"AやB = A, B e outras coisas (lista incompleta)."},
  {id:"p55", jp:"袋＿いりません。", pt:"Não preciso de sacola.", a:"は", o:["は","を","に","で"], exj:"断るときは「〜はいりません」。", ex:"Para recusar algo: 〜は いりません."},
  {id:"p56", jp:"百円＿ありません。", pt:"Só tenho cem ienes.", a:"しか", o:["しか","を","に","で"], exj:"「〜しか ＋ ない」＝ それだけ。少ないと思う気持ち。", ex:"〜しか + negativo = só (e você acha pouco)."},
  {id:"p57", jp:"一つ＿ください。", pt:"Só um, por favor.", a:"だけ", o:["だけ","しか","に","が"], exj:"「だけ」＝ それ以外はない。「しか」は「〜ない」と一緒に使います。", ex:"だけ = só. しか só aparece com verbo negativo."},
  {id:"p58", jp:"風邪＿ひきました。", pt:"Peguei um resfriado.", a:"を", o:["を","が","に","で"], exj:"「風邪をひく」で覚えよう。", ex:"Decore a expressão: かぜをひく."},
  {id:"p59", jp:"熱＿あります。", pt:"Estou com febre.", a:"が", o:["が","を","に","で"], exj:"「ある」ものは「が」：熱がある、時間がある。", ex:"Com ある, aquilo que existe (ou que você tem) leva が."},
  {id:"p60", jp:"これは母＿の手紙です。", pt:"Esta é uma carta para a minha mãe.", a:"へ", o:["へ","に","で","を"], exj:"「〜への ＋ もの」。「に」と「の」は一緒に使えません。「へ」は「え」と読みます。", ex:"〜への + substantivo = “para…”. Não se usa にの. Aqui へ se lê “e”."},
  {id:"p61", jp:"日本＿ようこそ。", pt:"Bem-vinda ao Japão.", a:"へ", o:["へ","を","が","で"], exj:"「〜へようこそ」：行き先の「へ」。", ex:"〜へ ようこそ = bem-vindo(a) a…"},
  {id:"p62", jp:"ここ＿名前を書いてください。", pt:"Escreva o seu nome aqui, por favor.", a:"に", o:["に","を","が","と"], exj:"書くところ（紙など）は「に」。", ex:"O lugar onde se escreve (o papel, o campo) leva に."},
  {id:"p63", jp:"ボールペン＿書いてください。", pt:"Escreva com caneta, por favor.", a:"で", o:["で","に","が","と"], exj:"使う道具は「で」。", ex:"O instrumento usado leva で."},
  {id:"p64", jp:"この紙＿何ですか。", pt:"O que é este papel?", a:"は", o:["は","を","に","で"], exj:"「〜は何ですか」：聞きたいものがテーマ。", ex:"〜は なんですか: a coisa sobre a qual você pergunta é o tópico."},
  {id:"p65", jp:"三番＿窓口へどうぞ。", pt:"Dirija-se ao guichê número três, por favor.", a:"の", o:["の","を","が","で"], exj:"「三番の窓口」：「の」で言葉をつなぎます。", ex:"の liga 三番 (número três) a まどぐち (guichê)."},
  {id:"p66", jp:"九時＿仕事が始まります。", pt:"O trabalho começa às nove.", a:"に", o:["に","を","が","と"], exj:"始まる時間は「に」。", ex:"O horário em que algo começa leva に."},
  {id:"p67", jp:"私はあとで会社＿電話します。", pt:"Eu vou ligar para a empresa depois.", a:"に", o:["に","を","と","の"], exj:"電話する相手は「に」。", ex:"Para quem você liga leva に."},
  {id:"p68", jp:"土曜日＿日曜日は休みです。", pt:"Sábado e domingo são folga.", a:"と", o:["と","を","に","で"], exj:"「AとB」：二つを並べます。", ex:"AとB = A e B."},
  {id:"p69", jp:"仕事＿終わりました。", pt:"O trabalho terminou.", a:"が", o:["が","に","と","へ"], exj:"「終わる」は「が」。「終える」は「を」。", ex:"終わる (terminar, por si) → が. 終える (terminar algo) → を."},
  {id:"p70", jp:"どれ＿あなたのですか。", pt:"Qual é o seu?", a:"が", o:["が","は","を","で"], exj:"「どれ・どこ・誰」が主語のときは「が」。「は」は ×。", ex:"Palavra interrogativa como sujeito leva が, nunca は."},
  {id:"p71", jp:"A：誰が作りましたか。　B：私＿作りました。", pt:"A: Quem fez? B: Fui eu que fiz.", a:"が", o:["が","を","に","で"], exj:"「誰が？」の答えも「が」：私が作りました。", ex:"A resposta a だれが também leva が."},
  {id:"p72", jp:"ジャスは背＿高いです。", pt:"O Jas é alto.", a:"が", o:["が","を","に","で"], exj:"「AはBが〜」：ジャス（テーマ）は、背（体の部分）が高い。", ex:"Padrão AはBが〜: o Jas (tópico) tem a estatura (が) alta."},
  {id:"p73", jp:"私は猫＿ほしいです。", pt:"Eu quero um gato.", a:"が", o:["が","に","で","と"], exj:"「ほしい」も「が」。", ex:"ほしい (querer ter) também usa が."},
  {id:"p74", jp:"肉は食べますが、魚＿食べません。", pt:"Carne eu como, mas peixe não.", a:"は", o:["は","に","で","と"], exj:"比べるときの「は」：肉は食べる、魚は食べない。", ex:"は de contraste: carne sim, peixe não."},
  {id:"p75", jp:"昨日＿暑かったですが、今日は涼しいです。", pt:"Ontem estava quente, mas hoje está fresco.", a:"は", o:["は","を","に","で"], exj:"比べるときの「は」：昨日は…、今日は…。", ex:"は de contraste: ontem…, hoje…"},
  {id:"p76", jp:"明日、私は友達＿会います。", pt:"Amanhã vou encontrar uma amiga.", a:"に", o:["に","を","で","の"], exj:"「会う」相手は「に」（「と」も OK）。「を」は ×。", ex:"会う (encontrar alguém) usa に (ou と), nunca を."},
  {id:"p77", jp:"日本語＿難しいですが、楽しいです。", pt:"Japonês é difícil, mas é divertido.", a:"は", o:["は","を","に","で"], exj:"「は」でテーマを出して、そのあと説明。", ex:"は apresenta o assunto e depois vem o comentário."},
  {id:"p78", jp:"この店は十時＿開いています。", pt:"Esta loja fica aberta até as dez.", a:"まで", o:["まで","を","が","と"], exj:"「まで」は終わりの時間。", ex:"まで = até (horário final)."},
  {id:"p79", jp:"明日＿明後日、暇ですか。", pt:"Você está livre amanhã ou depois de amanhã?", a:"か", o:["か","を","に","で"], exj:"「AかB」＝ A または B。", ex:"AかB = A ou B."},
  {id:"p80", jp:"私はコーヒー＿します。", pt:"Eu vou querer café.", a:"に", o:["に","が","で","と"], exj:"「〜にする」＝ 選ぶ。", ex:"〜に する = escolher, “vou querer…”."},
  {id:"p81", jp:"大きい＿をください。", pt:"Me dá o grande, por favor.", a:"の", o:["の","と","に","で"], exj:"「大きいの」＝ 大きいもの。", ex:"大きいの = o grande (の substitui o substantivo)."},
  {id:"p82", jp:"ひらがな＿書いてもいいですか。", pt:"Posso escrever em hiragana?", a:"で", o:["で","に","が","と"], exj:"どんな文字で書くかも「で」。", ex:"O tipo de escrita usado também leva で."},
  {id:"p83", jp:"部屋＿掃除します。", pt:"Vou limpar o quarto.", a:"を", o:["を","が","に","と"], exj:"掃除するところは「を」。", ex:"O que você limpa é o objeto → を."},
  {id:"p84", jp:"これは日本語＿何と言いますか。", pt:"Como se diz isto em japonês?", a:"で", o:["で","を","に","が"], exj:"何語で言うかは「で」。", ex:"A língua usada leva で."},
  {id:"p85", jp:"塩＿取ってください。", pt:"Me passa o sal, por favor.", a:"を", o:["を","に","で","と"], exj:"取るものは「を」。", ex:"O que você pega ou passa é o objeto → を."},
  {id:"p86", jp:"ジャスのお母さん＿挨拶します。", pt:"Cumprimento a mãe do Jas.", a:"に", o:["に","を","で","の"], exj:"挨拶する相手は「に」。", ex:"A pessoa que você cumprimenta leva に."},
  {id:"p87", jp:"これ、ブラジル＿お土産です。", pt:"Isto é uma lembrança do Brasil.", a:"の", o:["の","を","に","で"], exj:"「ブラジルのお土産」：どこのものかを「の」で言います。", ex:"の indica a origem: lembrança do Brasil."},
  /* ---- 追加（2026-11-17）：家・買い物・病院・役所・仕事・家族、自動詞と他動詞、比べる言い方 ---- */
  {id:"p88", jp:"台所＿料理をしています。", pt:"Estou cozinhando na cozinha.", a:"で", o:["で", "に", "を", "が"], exj:"料理は「すること」なので、場所は「で」。", ex:"Cozinhar é uma ação → o lugar leva で."},
  {id:"p89", jp:"冷蔵庫＿牛乳があります。", pt:"Tem leite na geladeira.", a:"に", o:["に", "で", "を", "へ"], exj:"ものがある場所は「に」。", ex:"O lugar onde algo está (ある) leva に."},
  {id:"p90", jp:"郵便局は駅の隣＿あります。", pt:"O correio fica ao lado da estação.", a:"に", o:["に", "で", "を", "と"], exj:"「〜は〜にあります」：場所は「に」。", ex:"[coisa] は [lugar] に あります: o lugar leva に."},
  {id:"p91", jp:"ゴミは月曜日＿出してください。", pt:"Coloque o lixo para fora na segunda-feira, por favor.", a:"に", o:["に", "で", "を", "が"], exj:"曜日は「に」：月曜日に、金曜日に。", ex:"Dia da semana leva に: 月曜日に."},
  {id:"p92", jp:"毎晩、お風呂＿入ります。", pt:"Tomo banho de banheira toda noite.", a:"に", o:["に", "を", "で", "が"], exj:"「お風呂に入る」で覚えよう。", ex:"Decore a expressão: おふろに はいる."},
  {id:"p93", jp:"毎朝シャワー＿浴びます。", pt:"Tomo banho de chuveiro toda manhã.", a:"を", o:["を", "に", "で", "が"], exj:"「シャワーを浴びる」。お風呂は「に入る」、シャワーは「を浴びる」。", ex:"シャワーを あびる. Compare: おふろに はいる / シャワーを あびる."},
  {id:"p94", jp:"電気＿消してください。", pt:"Apague a luz, por favor.", a:"を", o:["を", "が", "に", "で"], exj:"「消す」＝ 誰かが消す →「を」。", ex:"けす = apagar algo (alguém faz) → を."},
  {id:"p95", jp:"電気＿消えています。", pt:"A luz está apagada.", a:"が", o:["が", "を", "に", "で"], exj:"「消える」＝ ひとりでに消える →「が」。消すは「を」、消えるは「が」。", ex:"きえる = apagar-se → が. Par: けす を / きえる が."},
  {id:"p96", jp:"ドア＿閉まりました。", pt:"A porta se fechou.", a:"が", o:["が", "を", "に", "で"], exj:"「閉まる」は「が」、「閉める」は「を」。", ex:"しまる (fechar-se) → が. しめる (fechar algo) → を."},
  {id:"p97", jp:"駅＿バスに乗ります。", pt:"Pego o ônibus na estação.", a:"で", o:["で", "を", "が", "と"], exj:"乗る場所（どこで乗るか）は「で」。乗るものは「に」。", ex:"Onde você pega o ônibus leva で; o veículo leva に."},
  {id:"p98", jp:"この道＿まっすぐ行ってください。", pt:"Siga reto por esta rua, por favor.", a:"を", o:["を", "が", "に", "と"], exj:"通る道は「を」。", ex:"A rua por onde você passa leva を."},
  {id:"p99", jp:"りんご＿三つください。", pt:"Me dá três maçãs, por favor.", a:"を", o:["を", "が", "に", "で"], exj:"「〈もの〉を〈数〉ください」。数の前に「を」。", ex:"[coisa] を [quantidade] ください."},
  {id:"p100", jp:"レシート＿いりますか。", pt:"Precisa do recibo?", a:"は", o:["は", "を", "に", "で"], exj:"お店でよく聞く言い方：「〜はいりますか」。", ex:"Frase comum nas lojas: 〜は いりますか."},
  {id:"p101", jp:"ポイントカード＿持っていますか。", pt:"Você tem cartão de pontos?", a:"を", o:["を", "に", "で", "と"], exj:"持っているものは「を」。", ex:"O que você tem/carrega leva を."},
  {id:"p102", jp:"病院＿行ったほうがいいですよ。", pt:"É melhor você ir ao hospital.", a:"に", o:["に", "を", "で", "が"], exj:"行き先は「に」。", ex:"Destino de 行く leva に."},
  {id:"p103", jp:"市役所＿手続きをします。", pt:"Vou fazer os trâmites na prefeitura.", a:"で", o:["で", "を", "と", "へ"], exj:"手続きは「すること」なので、場所は「で」。", ex:"Fazer trâmites é uma ação → o lugar leva で."},
  {id:"p104", jp:"この書類＿サインしてください。", pt:"Assine este documento, por favor.", a:"に", o:["に", "を", "で", "が"], exj:"サインするところ（紙）は「に」。", ex:"O papel onde você assina leva に."},
  {id:"p105", jp:"私は外国人＿日本語を教えています。", pt:"Eu ensino japonês para estrangeiros.", a:"に", o:["に", "を", "と", "で"], exj:"教える相手は「に」。", ex:"Para quem você ensina leva に."},
  {id:"p106", jp:"会議は三時＿始まります。", pt:"A reunião começa às três.", a:"から", o:["から", "を", "が", "と"], exj:"「〜から始まる」：スタートの時間。", ex:"〜から はじまる: começa a partir de…"},
  {id:"p107", jp:"私は上司＿メールを送りました。", pt:"Mandei um e-mail para o meu chefe.", a:"に", o:["に", "を", "で", "が"], exj:"送る相手は「に」。", ex:"Para quem você manda algo leva に."},
  {id:"p108", jp:"仕事＿慣れましたか。", pt:"Você já se acostumou com o trabalho?", a:"に", o:["に", "を", "で", "が"], exj:"「〜に慣れる」で覚えよう。", ex:"Decore: 〜に なれる (acostumar-se com…)."},
  {id:"p109", jp:"明日は会社＿休みます。", pt:"Amanhã vou faltar ao trabalho.", a:"を", o:["を", "に", "と", "へ"], exj:"休む場所（会社・学校）は「を」：会社を休む。", ex:"Faltar a algum lugar: 会社を やすむ."},
  {id:"p110", jp:"来年、ジャス＿結婚します。", pt:"Ano que vem vou me casar com o Jas.", a:"と", o:["と", "を", "で", "へ"], exj:"結婚する相手は「と」。", ex:"Com quem você se casa leva と."},
  {id:"p111", jp:"ジャスの両親＿会うのが楽しみです。", pt:"Estou ansiosa para conhecer os pais do Jas.", a:"に", o:["に", "を", "で", "の"], exj:"会う相手は「に」。", ex:"A pessoa que você encontra leva に."},
  {id:"p112", jp:"週末、友達＿遊びました。", pt:"No fim de semana, saí com uma amiga.", a:"と", o:["と", "を", "に", "で"], exj:"一緒にする人は「と」。", ex:"と = com (companhia)."},
  {id:"p113", jp:"妹は私＿背が高いです。", pt:"Minha irmã mais nova é mais alta do que eu.", a:"より", o:["より", "から", "まで", "を"], exj:"「AはBより〜」＝ Bと比べてAのほうが〜。", ex:"AはBより… = A é mais… do que B."},
  {id:"p114", jp:"コーヒー＿紅茶、どちらが好きですか。", pt:"Você prefere café ou chá preto?", a:"と", o:["と", "を", "に", "で"], exj:"「AとB、どちらが〜」：二つを比べて聞きます。", ex:"AとB、どちらが…? = Qual você prefere, A ou B?"},
  {id:"p115", jp:"何＿飲みますか。", pt:"O que você vai beber?", a:"を", o:["を", "が", "に", "へ"], exj:"「何を〜ますか」：飲むものは「を」。", ex:"O que você bebe é o objeto → を."},
  {id:"p116", jp:"夏休みはどこ＿行きたいですか。", pt:"Nas férias de verão, aonde você quer ir?", a:"に", o:["に", "を", "で", "が"], exj:"「どこに行く？」：行き先は「に」。", ex:"Destino de 行く leva に: どこに?"},
  {id:"p117", jp:"誰＿行きますか。", pt:"Com quem você vai?", a:"と", o:["と", "を", "で", "へ"], exj:"「誰と？」：一緒に行く人は「と」。", ex:"だれと? = com quem?"},
  {id:"p118", jp:"これは何＿使うものですか。", pt:"Para que se usa isto?", a:"に", o:["に", "を", "が", "へ"], exj:"「何に使う」：使う目的は「に」。", ex:"なにに つかう = para que se usa."},
  {id:"p119", jp:"あの人＿誰ですか。", pt:"Quem é aquela pessoa?", a:"は", o:["は", "を", "に", "で"], exj:"「〜は誰ですか」：聞きたい人がテーマ。", ex:"〜は だれですか: a pessoa é o tópico."},
  {id:"p120", jp:"A：日本に行きたいです。　B：私＿行きたいです！", pt:"A: Quero ir ao Japão. B: Eu também quero!", a:"も", o:["も", "を", "に", "で"], exj:"「も」＝ 同じように。", ex:"も = também."},
  {id:"p121", jp:"一時間＿待ちました。", pt:"Esperei uma hora inteira!", a:"も", o:["も", "と", "に", "が"], exj:"〈数〉＋「も」＝ 多いと思う気持ち。", ex:"[número] + も = tudo isso! (você acha muito)."},
  {id:"p122", jp:"ひらがな＿読めます。", pt:"Consigo ler hiragana.", a:"が", o:["が", "に", "と", "へ"], exj:"「読める・話せる」（できる形）は「が」が普通。", ex:"Com a forma potencial, o objeto costuma levar が."},
  {id:"p123", jp:"私は料理＿下手です。", pt:"Eu cozinho mal.", a:"が", o:["が", "を", "で", "に"], exj:"「上手・下手」は「が」。", ex:"上手 / 下手 usam が."},
  {id:"p124", jp:"ブラジル＿日本は遠いです。", pt:"O Brasil e o Japão são longe um do outro.", a:"と", o:["と", "を", "が", "に"], exj:"「AとB」：二つを並べます。", ex:"AとB = A e B."},
  {id:"p125", jp:"家＿駅まで歩いて五分です。", pt:"De casa até a estação são cinco minutos a pé.", a:"から", o:["から", "を", "に", "が"], exj:"「AからBまで」：スタートは「から」。", ex:"AからBまで = de A até B."},
  {id:"p126", jp:"電車に傘＿忘れました。", pt:"Esqueci o guarda-chuva no trem.", a:"を", o:["を", "が", "に", "で"], exj:"忘れたものは「を」。忘れた場所は「に」。", ex:"O que você esqueceu leva を; o lugar leva に."},
  {id:"p127", jp:"今日は空＿きれいですね。", pt:"Hoje o céu está bonito, né?", a:"が", o:["が", "を", "で", "に"], exj:"見たままを言うときは「が」。", ex:"Para descrever o que você vê, usa-se が."},
  {id:"p128", jp:"天気＿いいので、散歩に行きましょう。", pt:"O tempo está bom, vamos passear.", a:"が", o:["が", "を", "で", "に"], exj:"「〜がいい」：天気がいい、頭がいい。", ex:"〜が いい: o tempo está bom."},
  {id:"p129", jp:"これは私＿傘です。", pt:"Este é o meu guarda-chuva.", a:"の", o:["の", "を", "に", "で"], exj:"誰のものかは「の」：私の傘。", ex:"の indica de quem é: わたしの かさ."},
  {id:"p130", jp:"日曜日は掃除＿洗濯をします。", pt:"No domingo eu limpo a casa, lavo roupa etc.", a:"や", o:["や", "を", "で", "が"], exj:"「AやB」＝ AとBと、他にもある。", ex:"AやB = A, B e outras coisas."},
  {id:"p131", jp:"ペン＿鉛筆を貸してください。", pt:"Me empresta uma caneta ou um lápis, por favor.", a:"か", o:["か", "を", "に", "で"], exj:"「AかB」＝ どちらか一つ。", ex:"AかB = A ou B."},
  {id:"p132", jp:"一週間＿二回、ジムに行きます。", pt:"Vou à academia duas vezes por semana.", a:"に", o:["に", "と", "を", "が"], exj:"回数は「〜に〜回」：一週間に二回、一日に三回。", ex:"Para frequência: 〜に 〜回 (X vezes por semana/dia)."},
  {id:"p133", jp:"風邪＿学校を休みました。", pt:"Faltei à escola por causa de um resfriado.", a:"で", o:["で", "を", "に", "が"], exj:"理由も「で」で言える：風邪で休む、雨で中止。", ex:"で também indica causa: por causa do resfriado."},
  {id:"p134", jp:"八時に家＿出ます。", pt:"Saio de casa às oito.", a:"を", o:["を", "で", "が", "へ"], exj:"出る場所は「を」：家を出る、駅を出る。", ex:"Com 出る (sair de), o lugar de onde se sai leva を."},
  {id:"p135", jp:"母＿作った料理が一番好きです。", pt:"A comida que minha mãe faz é a de que mais gosto.", a:"が", o:["が", "を", "で", "に"], exj:"名詞を説明する文の中では、した人に「が」：母が作った料理。", ex:"Dentro de uma frase que descreve um substantivo, quem faz a ação leva が."},
  {id:"p136", jp:"私は歌う＿が好きです。", pt:"Eu gosto de cantar.", a:"の", o:["の", "を", "に", "で"], exj:"動詞に「の」をつけると、「すること」になる：歌うのが好き。", ex:"Verbo + の vira “o ato de…”: うたうのが すき = gostar de cantar."},
  {id:"p137", jp:"日本語を勉強し＿日本に来ました。", pt:"Vim ao Japão para estudar japonês.", a:"に", o:["に", "で", "を", "と"], exj:"「〜しに来る／行く」で目的を言う：勉強しに来る。", ex:"Verbo (sem ます) + に くる/いく = vir/ir para fazer algo."},
  {id:"p138", jp:"ジャスは「おいしい」＿言いました。", pt:"O Jas disse: “Está gostoso”.", a:"と", o:["と", "が", "に", "で"], exj:"言ったことばには「と」：「〜」と言う。", ex:"Para citar o que alguém disse: 「…」と いう."},
  {id:"p139", jp:"明日は雨が降る＿思います。", pt:"Acho que amanhã vai chover.", a:"と", o:["と", "を", "に", "で"], exj:"自分の考えは「〜と思う」。", ex:"〜と おもう = acho que…"},
  {id:"p140", jp:"何時に始まる＿分かりません。", pt:"Não sei a que horas começa.", a:"か", o:["か", "を", "と", "に"], exj:"文の中に質問を入れるときは「か」：何時に始まるか。", ex:"Para colocar uma pergunta dentro da frase: …か わかりません."},
  {id:"p141", jp:"朝から何＿食べていません。", pt:"Não comi nada desde a manhã.", a:"も", o:["も", "が", "に", "と"], exj:"「何も〜ない」＝ 全然ない。", ex:"なにも + negativo = nada."},
  {id:"p142", jp:"この仕事は三日＿終わります。", pt:"Este trabalho termina em três dias.", a:"で", o:["で", "を", "が", "と"], exj:"かかる時間は「で」：三日で終わる。", ex:"で indica em quanto tempo: em 3 dias."},
  {id:"p143", jp:"ジャスは料理＿上手です。", pt:"O Jas cozinha bem.", a:"が", o:["が", "を", "で", "に"], exj:"「上手・下手・好き・嫌い」の前は「が」。", ex:"Antes de じょうず/へた/すき/きらい usa-se が."},
  {id:"p144", jp:"美容院で髪＿切りました。", pt:"Cortei o cabelo no salão.", a:"を", o:["を", "が", "に", "で"], exj:"何を切ったか→「を」。人に切ってもらっても「髪を切る」と言う。", ex:"を marca o objeto. Em japonês se diz かみを きる mesmo quando outra pessoa corta."},
  {id:"p145", jp:"銀行で口座＿作りたいです。", pt:"Quero abrir uma conta no banco.", a:"を", o:["を", "に", "で", "へ"], exj:"「口座を作る」＝ 銀行の口座を開く。", ex:"こうざを つくる = abrir uma conta."},
  {id:"p146", jp:"この服＿試着してもいいですか。", pt:"Posso experimentar esta roupa?", a:"を", o:["を", "に", "で", "が"], exj:"試着するもの→「を」。", ex:"O que você experimenta leva を."},
  {id:"p147", jp:"店員さん＿聞いてみます。", pt:"Vou perguntar ao funcionário.", a:"に", o:["に", "を", "で", "が"], exj:"聞く相手は「に」：店員さんに聞く。", ex:"A pessoa a quem você pergunta leva に."},
  {id:"p148", jp:"寝る前＿この薬を飲んでください。", pt:"Tome este remédio antes de dormir.", a:"に", o:["に", "を", "が", "と"], exj:"「〜前に」＝ 〜する前：寝る前に。", ex:"〜まえに = antes de…"},
  {id:"p149", jp:"ジャスと電話＿話しました。", pt:"Falei com o Jas por telefone.", a:"で", o:["で", "を", "に", "が"], exj:"道具・方法は「で」：電話で話す。", ex:"で indica o meio: pelo telefone."},
  {id:"p150", jp:"ブラジルの家族＿ビデオ通話をします。", pt:"Faço chamada de vídeo com a minha família do Brasil.", a:"と", o:["と", "を", "で", "が"], exj:"一緒にする相手は「と」。", ex:"と = com (alguém)."},
  {id:"p151", jp:"雨の日は家＿ゆっくりします。", pt:"Em dia de chuva, eu descanso em casa.", a:"で", o:["で", "に", "を", "が"], exj:"何かをする場所は「で」：家でゆっくりする。", ex:"O lugar onde se faz algo leva で."},
  {id:"p152", jp:"この近く＿コンビニはありますか。", pt:"Tem uma loja de conveniência aqui perto?", a:"に", o:["に", "で", "を", "と"], exj:"ある・いる の場所は「に」。", ex:"Com ある/いる, o lugar leva に."},
  {id:"p153", jp:"日本の冬はブラジル＿寒いです。", pt:"O inverno do Japão é mais frio que o do Brasil.", a:"より", o:["より", "から", "まで", "と"], exj:"「AはBより〜」＝ AのほうがBより〜。", ex:"A は B より 〜 = A é mais 〜 que B."},
  {id:"p154", jp:"私が住んでいる町＿静かです。", pt:"A cidade onde eu moro é tranquila.", a:"は", o:["は", "を", "に", "で"], exj:"長い説明がついても、話のテーマは「は」。", ex:"Mesmo com uma descrição longa, o tópico continua com は."},
  {id:"p155", jp:"ジャス＿くれた指輪をいつもつけています。", pt:"Eu sempre uso o anel que o Jas me deu.", a:"が", o:["が", "を", "で", "と"], exj:"名詞を説明する文の中では、した人に「が」：ジャスがくれた指輪。", ex:"Dentro de uma frase que descreve um substantivo, quem faz a ação leva が."},
  {id:"p156", jp:"日本語が分かる人＿いますか。", pt:"Tem alguém que entende japonês?", a:"が", o:["が", "を", "で", "に"], exj:"「いる・ある」の前は「が」：〜人がいる。", ex:"Antes de いる/ある usa-se が."},
  {id:"p157", jp:"駅＿迎えに来てくれますか。", pt:"Você pode vir me buscar na estação?", a:"まで", o:["まで", "を", "と", "が"], exj:"「駅まで迎えに来る」＝ 駅のところまで来る。", ex:"えきまで むかえに くる = vir buscar até a estação."},
  {id:"p158", jp:"部長に会議の資料＿渡しました。", pt:"Entreguei os documentos da reunião ao chefe.", a:"を", o:["を", "が", "で", "と"], exj:"渡すものは「を」、渡す相手は「に」。", ex:"O que se entrega leva を; a pessoa leva に."},
  {id:"p159", jp:"この電車は次の駅＿止まりますか。", pt:"Este trem para na próxima estação?", a:"に", o:["に", "を", "が", "と"], exj:"止まる所は「に」：次の駅に止まる。", ex:"O lugar onde o trem para leva に."},
  {id:"p160", jp:"日本語が上手＿なりたいです。", pt:"Quero ficar boa em japonês.", a:"に", o:["に", "を", "が", "で"], exj:"変わったあとのことは「に」：上手になる、元気になる。", ex:"〜に なる = tornar-se / ficar."},
  {id:"p161", jp:"この靴は私＿は少し小さいです。", pt:"Estes sapatos são um pouco pequenos para mim.", a:"に", o:["に", "を", "で", "が"], exj:"「〜には大きい・小さい」＝ 〜にとって。", ex:"〜には = para (alguém): para mim é pequeno."},
  {id:"p162", jp:"引っ越し＿手伝ってくれてありがとう。", pt:"Obrigada por me ajudar com a mudança.", a:"を", o:["を", "に", "と", "が"], exj:"手伝うことは「を」：引っ越しを手伝う。", ex:"O que se ajuda a fazer leva を."},
  {id:"p163", jp:"ジャスに日本語＿教えてもらいました。", pt:"O Jas me ensinou japonês.", a:"を", o:["を", "が", "で", "と"], exj:"教えてもらったこと→「を」、教えてくれた人→「に」。", ex:"O que foi ensinado leva を; quem ensinou leva に."},
  {id:"p164", jp:"友達に駅まで車＿送ってもらいました。", pt:"Um amigo me levou de carro até a estação.", a:"で", o:["で", "を", "に", "が"], exj:"方法は「で」：車で送る。", ex:"で indica o meio: de carro."},
  {id:"p165", jp:"写真＿撮ってもいいですか。", pt:"Posso tirar uma foto?", a:"を", o:["を", "が", "に", "で"], exj:"撮るもの→「を」。", ex:"O que se fotografa leva を."},
  {id:"p166", jp:"名前＿呼ばれたら、中に入ってください。", pt:"Quando chamarem o seu nome, entre, por favor.", a:"を", o:["を", "に", "で", "と"], exj:"「名前を呼ばれる」：呼ばれたものは「を」のまま。", ex:"なまえを よばれる = ter o nome chamado."},
  {id:"p167", jp:"先生＿ほめられました。", pt:"Fui elogiada pela professora.", a:"に", o:["に", "を", "で", "と"], exj:"「〜られる」の文で、した人は「に」：先生にほめられる。", ex:"Na voz passiva (〜られる), quem faz a ação leva に."},
  {id:"p168", jp:"ジャスの誕生日＿ケーキを作ります。", pt:"Vou fazer um bolo no aniversário do Jas.", a:"に", o:["に", "を", "が", "と"], exj:"特別な日は「に」：誕生日に。", ex:"Datas especiais levam に: no aniversário."},
  {id:"p169", jp:"雪＿見たことがありますか。", pt:"Você já viu neve?", a:"を", o:["を", "が", "に", "で"], exj:"「〜を見たことがある」で、したことがあるかを言う。", ex:"〜を みた ことが ある = já ter visto…"},
  {id:"p170", jp:"日本のお祭り＿行ってみたいです。", pt:"Quero ir a um festival japonês.", a:"に", o:["に", "を", "が", "と"], exj:"行く所は「に」：お祭りに行く。", ex:"O destino leva に."},
  {id:"p171", jp:"この漢字の読み方＿教えてください。", pt:"Me ensine a leitura deste kanji, por favor.", a:"を", o:["を", "が", "に", "で"], exj:"教えてほしいこと→「を」。", ex:"O que você quer que ensinem leva を."},
  {id:"p172", jp:"ここから富士山＿見えます。", pt:"Daqui dá para ver o Monte Fuji.", a:"が", o:["が", "を", "で", "に"], exj:"「見える・聞こえる」の前は「が」。", ex:"Antes de みえる/きこえる usa-se が."},
  {id:"p173", jp:"隣の部屋から音楽＿聞こえます。", pt:"Dá para ouvir música do quarto ao lado.", a:"が", o:["が", "を", "で", "に"], exj:"「聞こえる」の前は「が」。", ex:"Antes de きこえる usa-se が."},
  {id:"p174", jp:"子どもの時、ピアノ＿習っていました。", pt:"Quando era criança, eu fazia aula de piano.", a:"を", o:["を", "が", "に", "で"], exj:"習うこと→「を」：ピアノを習う。", ex:"O que se aprende leva を."},
  {id:"p175", jp:"赤ちゃん＿生まれました。", pt:"O bebê nasceu.", a:"が", o:["が", "を", "で", "に"], exj:"起きたことを言うときは「が」：赤ちゃんが生まれた。", ex:"Para contar um acontecimento, usa-se が."},
  {id:"p176", jp:"大きい声＿話してください。", pt:"Fale em voz alta, por favor.", a:"で", o:["で", "を", "に", "が"], exj:"どうやって話すか→「で」：大きい声で。", ex:"で indica a maneira: em voz alta."},
  {id:"p177", jp:"日本では、家に入るとき靴＿脱ぎます。", pt:"No Japão, tiramos os sapatos ao entrar em casa.", a:"を", o:["を", "が", "に", "で"], exj:"脱ぐもの→「を」：靴を脱ぐ。", ex:"O que se tira leva を."},
  {id:"p178", jp:"夏休みに家族＿旅行しました。", pt:"Nas férias de verão viajei com a família.", a:"と", o:["と", "を", "に", "へ"], exj:"一緒にする相手は「と」。", ex:"と = com (alguém)."},
  {id:"p179", jp:"毎日、日記＿書いています。", pt:"Escrevo um diário todos os dias.", a:"を", o:["を", "が", "に", "で"], exj:"書くもの→「を」。", ex:"O que se escreve leva を."},
  {id:"p180", jp:"ジャスはサッカー＿興味があります。", pt:"O Jas se interessa por futebol.", a:"に", o:["に", "を", "で", "と"], exj:"「〜に興味がある」で覚えよう。", ex:"Decore: 〜に きょうみが ある (ter interesse em…)."},
  {id:"p181", jp:"ここ＿たばこを吸わないでください。", pt:"Não fume aqui, por favor.", a:"で", o:["で", "に", "を", "が"], exj:"何かをする場所は「で」。", ex:"O lugar onde se faz algo leva で."},
  {id:"p182", jp:"友達＿お金を借りました。", pt:"Peguei dinheiro emprestado de um amigo.", a:"に", o:["に", "を", "で", "が"], exj:"借りる相手は「に」（「から」でもいい）。", ex:"De quem se pega emprestado leva に (ou から)."},
  {id:"p183", jp:"ジャスの家は駅＿近いです。", pt:"A casa do Jas é perto da estação.", a:"から", o:["から", "を", "で", "と"], exj:"「〜から近い・遠い」。", ex:"〜から ちかい/とおい = perto/longe de…"},

      if(!s.startsWith(e.b, i)) continue;
      const nx = s[i + e.b.length] || "", pv = i > 0 ? s[i-1] : "";
      if(/^（[ぁ-んー]+）/.test(s.slice(i + e.b.length, i + e.b.length + 10))) continue;   // 文の中に読みが書いてある
      if(e.next && !(nx && e.next.includes(nx))) continue;
      if(e.prev && !(pv && e.prev.includes(pv))) continue;
      hit = e; break;
    }
    if(hit){ out.push([hit.b, hit.r]); i += hit.b.length; }
    else out.push([s[i++], null]);
  }
  return out;
}

function blank(){ return {total:0,balance:0,days:{},rest:{},restWeeks:{},weeklyBonus:{},pstats:{},partStats:{},tstats:{},writings:[],diaries:[],redemptions:[],bestStreak:0,outbox:[],showPt:false,furi:false}; }
/* 読みこみ。こわれていたら、こわれたデータを別のキーに残して、予備（1日1回の控え）から戻す。
   キー kotonoha-v1 の形は変えない。予備は別のキーに置く。 */
const BAK = KEY + "-bak";
function load(){
  let raw = null; try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{ const s = JSON.parse(raw); if(s && typeof s === "object"){ keepBackup(raw); return Object.assign(blank(), s); } }catch(e){}
    try{ localStorage.setItem(KEY + "-broken", raw); }catch(e){}
  }
  try{ const b = JSON.parse(localStorage.getItem(BAK)); if(b && b.s){ const s = JSON.parse(b.s); if(s && typeof s === "object") return Object.assign(blank(), s); } }catch(e){}
  return blank();
}
function keepBackup(raw){
  try{ const stamp = todayKey(); const b = JSON.parse(localStorage.getItem(BAK) || "null");
    if(b && b.d === stamp) return; localStorage.setItem(BAK, JSON.stringify({d:stamp, s:raw})); }catch(e){}

function weekKey(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return ymd(x); }
/* 練習を始めた日の日付で記録する（3時をまたいでも、その回は始めた日に入れる）。
   ただし前の日に始めたものは、区切りから1時間（朝4時）まで。それより後は今日に入れる（開いたまま放っておいた場合など）。 */
function sessKey(k){
  const t = todayKey();
  if(!k || k === t) return t;
  return (k === ymd(addDays(parseKey(t), -1)) && now0().getHours() < 1) ? k : t;
}
function day(k){ k = k || todayKey(); if(!S.days[k]) S.days[k] = {pts:0,pc:0,pw:0,pwq:[],tr:[],diary:0,goalMet:false}; return S.days[k]; }
/* きょうの日課の進みぐあい（助詞・作文・日記） */
function quest(d){
  const q = CONFIG.daily;
  const items = [
    {k:"p", n:Math.min(d.pc + d.pw, q.particles), of:q.particles},
    {k:"w", n:Math.min(d.tr.length, q.writing), of:q.writing},
    {k:"d", n:Math.min(d.diary, q.diary), of:q.diary}
  ].filter(x => x.of > 0);
  const done = items.filter(x => x.n >= x.of).length;
  return {items, done, total:items.length, all:items.length > 0 && done === items.length,
    frac:items.length ? items.reduce((s, x) => s + x.n / x.of, 0) / items.length : 0, by:k => items.find(x => x.k === k)};
}
/* 来日の移動の日（来日の日と、その前の CONFIG.travelDays 日）。練習しなくても連続に数える。保存はしない（計算で決める） */
function travelDay(k){
  const a = LD.arrive; if(!a) return false;
  return k <= a && k >= ymd(addDays(parseKey(a), -(CONFIG.travelDays || 0)));
}
const counted = k => !!((S.days[k] && S.days[k].goalMet) || S.rest[k] || travelDay(k));
function streak(){ let d = parseKey(todayKey()); if(!counted(ymd(d))) d = addDays(d,-1); let n = 0; while(counted(ymd(d))){ n++; d = addDays(d,-1); } return n; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function pickWeighted(arr, wf, n){
  const pool = arr.map(x => ({x, w:wf(x)})); const out = [];
  while(out.length < n && pool.length){
    const tot = pool.reduce((s,p) => s+p.w, 0); let r = Math.random()*tot, i = 0;
    for(; i < pool.length-1; i++){ r -= pool[i].w; if(r <= 0) break; }
    out.push(pool[i].x); pool.splice(i,1);
  }
  return out;
}

/* 一度だけの修正：0時すぎに練習が終わって切れてしまった連続記録を戻す（2026年11月） */
function repairStreakOnce(){
  if(S.fix1122) return;
  S.fix1122 = 1;
  const t = parseKey(todayKey());
  for(let i = 1; i <= 6; i++){
    const d = addDays(t, -i), k = ymd(d);
    if(k < "2026-11-15") break;
    if(counted(k)) continue;
    const prev = ymd(addDays(d,-1)), next = ymd(addDays(d,1));
    const tried = (S.days[k] && S.days[k].pts > 0) || (S.days[next] && S.days[next].pts > 0);
    if(counted(prev) && tried){
      S.rest[k] = "fix";

/* レポートの下につけるバックアップ（送る瞬間の最新データ） */
/* GAS は本文を 200,000字で切るので、データが増えると（1年で約30万字）バックアップが途中で切れて戻せなくなる。
   そこで gzip で圧縮して「KTZ1:」＋base64 の1行にする（1年分でも数万字）。圧縮できない端末では、そのままの JSON。 */
const ZTAG = "KTZ1:";
async function packSnap(){
  const json = JSON.stringify(snapshot());
  if(typeof CompressionStream === "undefined") return json;
  try{
    const buf = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
    let bin = ""; for(let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return ZTAG + btoa(bin);
  }catch(e){ return json; }
}
/* 戻すときに読む：圧縮した1行（KTZ1:…）でも、ふつうの JSON でもよい */
async function unpackSnap(text){
  text = String(text).trim();
  const at = text.indexOf(ZTAG);
  if(at < 0) return text;
  const bin = atob(text.slice(at + ZTAG.length).replace(/[^A-Za-z0-9+/=]/g, ""));
  const buf = Uint8Array.from(bin, c => c.charCodeAt(0));
  return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
async function backupText(){
  return "\n\n――――――――――――\n💾 バックアップ（読まなくてOK）\nデータが消えたときは、下の1行（KTZ1: から最後まで）を kotonoha.json という名前で保存して彼女に送り、「成長 → 戻す」で選んでもらいます。\n" + await packSnap();
}
/* サーバーが「ok」と返したときだけ、送信待ちから消す。失敗したら残して、あとでもう一度送る。 */
let flushing = false;
async function flush(){
  if(flushing || !CONFIG.scriptUrl || !S.outbox.length || !navigator.onLine) return;
  flushing = true;
  let sent = 0;
  try{
    while(S.outbox.length){
      const it = S.outbox[0]; let ok = false;
      try{
        const body = it.body + (it.snap ? await backupText() : "");
        const res = await fetch(CONFIG.scriptUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify({token:CONFIG.token, id:it.id || String(it.ts), subject:it.subject, body, replyTo:CONFIG.studentEmail})});
        const txt = (await res.text()).trim();
        ok = res.ok && (txt === "ok" || txt === "dup");
      }catch(e){}
      if(!ok) break;
      if(S.outbox[0] === it) S.outbox.shift();
      save(); sent++;
    }
  } finally { flushing = false; }
  if(sent) refresh();
}

/* =========================================================
   演出：花火・バラの爆発・紙ふぶき・ハート・花びら・スタンプ
   1枚の canvas に描く（0円・オフラインでも動く）。端末が「動きを減らす」設定なら、スタンプだけにする。
   ========================================================= */
const FX = (() => {
  let cv, ctx, W = 0, H = 0, ps = [], raf = 0, night = 0;
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const R = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const PAL = [["#ff4f9a","#ffb3d6","#ffffff"],["#a77bff","#dccbff","#ffffff"],["#2fcf9a","#bff3e1","#ffffff"],["#ffc21a","#fff0b3","#ffffff"],["#ff6b6b","#ffc1c1","#ffe0e0"],["#4fb8ff","#cdeaff","#ffffff"]];
  function size(){ const d = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function init(){ if(cv) return; cv = document.createElement("canvas"); cv.id = "fx"; document.body.appendChild(cv); ctx = cv.getContext("2d"); size(); addEventListener("resize", size); }
  function add(p){
    if(reduce) return; init();
    if(ps.length > 900) return;
    ps.push(Object.assign({kind:"dot", vx:0, vy:0, g:.12, drag:.985, life:0, max:90, size:4, rot:R(0, 6.3), vr:0, sway:0, ph:R(0, 99), trail:false, tw:false}, p));
    if(!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0, 0, W, H);
    if(night > 0){ ctx.globalAlpha = Math.min(.42, night / 60 * .42); ctx.fillStyle = "#2b1840"; ctx.fillRect(0, 0, W, H); night--; }
    const list = ps; ps = [];
    for(let k = 0; k < list.length; k++){
      const p = list[k]; p.life++;
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
      p.x += p.vx + (p.sway ? Math.sin((p.life + p.ph) / 14) * p.sway : 0); p.y += p.vy; p.rot += p.vr;
      if(p.kind === "rocket" && (p.vy >= -1.2 || p.life >= p.max)){ explode(p.x, p.y, p.pal, p.big, p.shape); continue; }
      if(p.life >= p.max || p.y > H + 80 || p.y < -200){ if(p.end) p.end(p); continue; }
      const t = p.life / p.max, a = t > .65 ? Math.max(0, (1 - t) / .35) : 1;
      ctx.globalAlpha = a * (p.tw && t > .5 && Math.random() < .35 ? .25 : 1);
      if(p.kind === "emoji"){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.font = `${p.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(p.e, 0, 0); ctx.restore();
      } else if(p.kind === "rect"){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.life / 6 + p.ph)); ctx.fillStyle = p.c; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
      } else {
        if(p.trail){ ctx.strokeStyle = p.c; ctx.lineWidth = p.size * .8; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(p.x - p.vx * 3.2, p.y - p.vy * 3.2); ctx.lineTo(p.x, p.y); ctx.stroke(); }
        ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
      }
      ps.push(p);
    }
    ctx.globalAlpha = 1;
    raf = ps.length || night > 0 ? requestAnimationFrame(tick) : 0;
    if(!raf) ctx.clearRect(0, 0, W, H);
  }
  /* 花火の玉がはじける（まる・ハート・ふつう） */
  function explode(x, y, pal, big, shape){
    pal = pal || pick(PAL); shape = shape || pick(["peony","ring","heart","peony"]);
    const n = big ? 120 : 80, sp = big ? 7.5 : 5.5;
    for(let k = 0; k < n; k++){
      let vx, vy;
      if(shape === "heart"){ const t = k / n * 6.283, hx = 16 * Math.pow(Math.sin(t), 3), hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); vx = hx / 16 * sp * .9; vy = hy / 16 * sp * .9; }
      else { const ang = R(0, 6.283), v = shape === "ring" ? sp * R(.9, 1) : sp * Math.sqrt(Math.random()); vx = Math.cos(ang) * v; vy = Math.sin(ang) * v; }
      add({x, y, vx, vy, g:.07, drag:.965, max:R(55, 85), size:R(1.6, 2.8), c:pal[k % pal.length], trail:true, tw:true,
        end: Math.random() < .12 ? q => { for(let m = 0; m < 4; m++) add({x:q.x, y:q.y, vx:R(-1.5, 1.5), vy:R(-1.5, 1.5), g:.05, max:22, size:1.3, c:"#fff"}); } : null});
    }
    add({x, y, max:8, size:big ? 26 : 18, c:"rgba(255,255,255,.9)", g:0});   // 光
  }
  function rocket(x, y, opt){
    opt = opt || {}; init(); const vy = -Math.sqrt(2 * .16 * Math.max(60, H + 10 - y));
    add({kind:"rocket", x, y:H + 10, vx:R(-.4, .4), vy, g:.16, drag:1, max:200, size:2.4, c:"#fff3c4", trail:true, pal:opt.pal, big:opt.big, shape:opt.shape});
  }
  return {
    R, pick, PAL,
    get reduce(){ return reduce; },
    dark(frames){ if(reduce) return; init(); night = Math.max(night, frames || 120); if(!raf) raf = requestAnimationFrame(tick); },
    /* 花火を何発か打ちあげる */
    fireworks(n, opt){ init(); opt = opt || {}; for(let k = 0; k < n; k++) setTimeout(() => rocket(R(W * .15, W * .85), R(H * .15, H * .42), {big:opt.big || Math.random() < .3, shape:opt.shape}), k * (opt.gap || 380) + R(0, 120)); },
    /* その場で花火をはじけさせる（ボタンの上など） */
    pop(x, y, big, shape){ init(); explode(x, y, null, big, shape); },
    /* 絵文字が放射状に飛びちる（バラの爆発など） */
    burst(x, y, emojis, n, opt){ init(); opt = opt || {};
      for(let k = 0; k < (n || 16); k++){ const ang = R(0, 6.283), v = R(opt.min || 3, opt.max || 10);
        add({kind:"emoji", e:pick(emojis), x, y, vx:Math.cos(ang) * v, vy:Math.sin(ang) * v - (opt.up || 2), g:opt.g || .22, drag:.975, max:R(60, 95), size:R(opt.s1 || 18, opt.s2 || 34), vr:R(-.2, .2)}); } },
    /* 紙ふぶきを左右の下から打ちあげる */

/* ---------- ふくしゅうの間隔（日付で管理） ----------
   問題ごとに box（0〜6）と due（つぎに出す日）を pstats / tstats に足す（もとの形はそのまま、項目を足すだけ）。
   せいかい → box が1つ上がり、出る間隔がのびる（その日・1日・3日・7日・14日・30日・60日）。まちがい → box 0。 */
const GAPS = [0, 1, 3, 7, 14, 30, 60];
function srsSet(s, box){ s.box = Math.max(0, Math.min(GAPS.length - 1, box)); s.due = ymd(addDays(parseKey(todayKey()), GAPS[s.box])); }
function srsWeight(s, legacy){
  if(!s) return 2;                       // まだ 出ていない問題
  if(s.due === undefined) return legacy;  // 前の版で 答えた問題（日付がまだない）
  if(s.due <= todayKey()) return s.box === 0 ? 8 : 6;
  return 0.2;                             // まだ 出す日では ない
}

  P = {qs, i:0, res:[], earned:0, main:qs.length, wrong:[], retried:false, k:todayKey()}; curRun = "p";
  $("practice-menu").style.display = "none"; $("practice-run").style.display = "";

}

function renderP(){

      <div class="sentence">${furi(esc(q.jp)).replace("＿", '<span class="blank" id="blank">？</span>')}</div>

      <div id="p-after"></div>
    </div>`;

function answerP(btn, o){
  const q = P.qs[P.i], ok = o === q.a, retry = P.i >= P.main;
  document.querySelectorAll(".opts button").forEach(b => { b.disabled = true; if(b.textContent === q.a) b.classList.add("right"); });
  if(!ok) btn.classList.add("wrong");
  if(ok){ P.combo = (P.combo || 0) + 1; Party.correct(btn, retry ? 0 : P.combo); } else { P.combo = 0; Party.wrong(btn); }
  const bl = $("blank"); bl.textContent = q.a; bl.classList.add("ok");
  P.res[P.i] = ok;
  if(!retry){   // もう一度の ときは、きろく・ポイント・日課に 入れない
    const s = S.pstats[q.id] || (S.pstats[q.id] = {c:0,w:0}); ok ? s.c++ : s.w++;
    const prev = s.box !== undefined ? s.box : Math.max(0, Math.min(2, s.c - s.w - (ok ? 1 : 0)));
    srsSet(s, ok ? prev + 1 : 0);
    const ps = S.partStats[q.a] || (S.partStats[q.a] = {c:0,w:0}); ok ? ps.c++ : ps.w++;
    P.k = sessKey(P.k); const d = day(P.k); ok ? d.pc++ : (d.pw++, d.pwq.push({id:q.id, chose:o}));
    if(!ok) P.wrong.push({q, chose:o});
    const pts = ok ? CONFIG.points.particleRight : CONFIG.points.particleWrong; P.earned += pts;
    addPoints(pts, P.k, !ok);   // まちがえたときは「+1」を出さない（ポイントは入る）
  } else save();

function nextStep(from){

function nextP(){

  if(P.i < P.qs.length){ renderP(); return; }
  const n = P.main, right = P.res.slice(0, n).filter(Boolean).length;

}

      <button class="linkbtn" id="w-idk" style="display:block;margin:10px auto 0" onclick="showW(true)">${T("🤔 分からない（答えを見る）","Não sei — ver a resposta")}</button>
      <div id="w-after"></div>

function showHint(){ const q = W.qs[W.i]; $("hint-btn").style.display = "none"; $("hint-box").innerHTML = `<div class="explain">💡 ${T(furi(esc(q.h)), esc(q.hp), true)}</div>`; applyPt(); }
/* よみを ならべて、ちがう ところに 色を つける */
function cmpHtml(na, cands){
  const best = cands.map(n => ({n, m:lcsMask(na, n)})).map(x => ({...x, r:2 * x.m.len / (na.length + x.n.length || 1)})).sort((a, b) => b.r - a.r)[0];
  if(!best || best.r < 0.4) return "";
  return `
    <label>${T("読みで比べると","Comparando a leitura")}</label>
    <div class="yours kana">${markDiff(na, best.m.ma, "df-ng")}</div>
    <div class="model kana">${markDiff(best.n, best.m.mb, "df-add")}</div>
`;
}
/* 答えの例は1つだけ見せる（i ＝ 彼女の答えに一番近いもの。ほかの言い方も、正解として判定には使う） */
const modelsHtml = (q, i) => { i = i || 0; return `<div class="model">${furi(esc(q.a[i]))}${canSpeak ? `<button class="spk" onclick="speakW(${i})" aria-label="Ouvir">🔊</button>` : ""}</div>`; };
/* 一番近い答えの例の番号（読みで くらべる） */
/* 答えが答えの例のどれかと同じか（順番どおり・文の順番を入れかえて の両方でくらべる）。同じなら その番号、ちがえば -1 */
function matchIdx(ans, list){
  const a = looseKey(ans), b = looseKey(ans, true);
  if(!a) return -1;
  let i = list.findIndex(x => looseKey(x) === a);
  if(i < 0) i = list.findIndex(x => looseKey(x, true) === b);
  return i;
}
function closest(na, cands){
  let bi = 0, br = -1;
  cands.forEach((n, i) => { const r = 2 * lcsMask(na, n).len / (na.length + n.length || 1); if(r > br){ br = r; bi = i; } });
  return bi;
}
/* 答えの例を出したあと、下のボタン（◎○△ や 次へ）が見えるところまで動かす（下のメニューにかくれないように） */
function scrollToAction(el){
  if(!el) return;
  setTimeout(() => { try{ const r = el.getBoundingClientRect(), nav = document.querySelector("nav .in"), lim = (nav ? nav.getBoundingClientRect().top : innerHeight) - 16;
    if(r.bottom > lim) window.scrollBy({top: r.bottom - lim, behavior: "smooth"}); }catch(e){} }, 60);
}
function showW(idk){
  const q = W.qs[W.i], ans = idk ? "" : $("w-ans").value.trim();
  $("w-ans").disabled = true; $("w-show").style.display = "none"; $("w-idk").style.display = "none";
  // 分からなかったとき：答えの例を見て、つぎの画面で見ないで書いてみる（△として記録）
  if(idk){
    $("w-ans").style.display = "none";
    $("w-after").innerHTML = `
      <label>${T("答えの例","Exemplo de resposta")}</label>${modelsHtml(q)}
      <div class="explain"><div class="hd" style="margin:0">${T("🌱 覚えたら、見ないで書いてみよう","Memorize e depois escreva sem olhar")}</div></div>
      <button class="block" id="w-idk-go" style="margin-top:12px" onclick="gradeW(1,false,true)">${T("書いてみる ✍️","Vou tentar escrever")}</button>`;
    scrollToAction($("w-idk-go")); applyPt(); return;
  }
  // よみ（ひらがな）に そろえて くらべる。漢字でも ひらがなでも、答えの例と おなじなら「ぴったり」。
  const na = looseKey(ans), cands = q.a.map(x => looseKey(x)), mi = matchIdx(ans, q.a);
  const exact = mi >= 0;
  const bi = exact ? mi : closest(na, cands);
  const cmp = exact ? "" : cmpHtml(na, [cands[bi]]);
  W.bi = bi;
  $("w-after").innerHTML = `
    <label>${T("答えの例","Exemplo de resposta")}</label>${modelsHtml(q, bi)}
    ${exact ? `<div class="explain" style="background:var(--mint-s)"><div class="hd">${T("🌸 ぴったり！","Perfeito!")}</div>${T("答えの例と同じだよ。","Igual ao exemplo de resposta.")}</div>
    <button class="block" style="margin-top:12px" onclick="gradeW(3,true)">${T("次へ →","Próxima")}</button>` : `${cmp}
    <p style="margin-top:12px;font-weight:900">${T("どうだった？","Como foi?")}</p>
    <div class="grades">
      <button class="g3" onclick="gradeW(3)">${T("◎ できた","Acertei")}</button>
      <button class="g2" onclick="gradeW(2)">${T("○ おしい","Quase")}</button>
      <button class="g1" onclick="gradeW(1)">${T("△ 間違えた","Errei")}</button>
    </div>`}`;
  if(exact) setTimeout(() => { Party.rose(); FX.fireworks(3); stamp("ぴったり！🌹", "Igualzinho ao exemplo!"); }, 150);
  applyPt();
  scrollToAction(document.querySelector("#w-after .grades") || document.querySelector("#w-after button.block"));
}
function gradeW(g, auto, idk){
  const q = W.qs[W.i], ans = idk ? "" : $("w-ans").value.trim();
  if(!auto && !idk){ const el = document.querySelector(g === 3 ? ".grades .g3" : g === 2 ? ".grades .g2" : ".grades .g1");
    if(el){ if(g === 3) Party.correct(el, 0); else floaty(el, g === 2 ? "おしい！" : "次はできるよ 🍀"); } }
  const old = S.tstats[q.id] || {}, prev = old.box !== undefined ? old.box : (old.grade === 3 ? 1 : 0);
  const s = {grade:g, n:(old.n || 0) + 1}; srsSet(s, g === 3 ? prev + 1 : g === 2 ? Math.min(prev, 1) : 0);
  S.tstats[q.id] = s;
  const rec = {id:q.id, ans, grade:g}; if(auto) rec.auto = true; if(idk) rec.idk = true;   // idk：分からなくて答えを見た
  W.k = sessKey(W.k);
  const wrec = Object.assign({date:W.k}, rec);
  day(W.k).tr.push(rec); S.writings.push(wrec);
  W.recs = [rec, wrec]; W.pend = true; save();
  // ○・△ の ときは、答えの例を 見ないで もう一度書く（ポイントは そのあとで 入る）
  if(!auto && g < 3) renderRedo(); else doneW();
}
/* 書いた 文の ポイントを 入れる（書きなおしの とちゅうで やめても 入る） */
function settleW(){
  if(!W || !W.pend) return;
  W.pend = false; W.earned += CONFIG.points.writing;
  addPoints(CONFIG.points.writing, W.k);
}
function renderRedo(){
  const q = W.qs[W.i];
  $("practice-run").innerHTML = `

      <button class="soft" id="peek-btn" onclick="const b=$('peek-box');b.style.display=b.style.display?'':'none'">👀 ${T("ちょっと見る","Espiar")}</button>
      <div id="peek-box" style="display:none">${modelsHtml(q, W.bi || 0)}</div>
      <textarea id="r-ans" rows="2" placeholder="ここに日本語で…" oninput="$('r-check').disabled = this.value.trim().length < 2"></textarea>
      <button class="block" id="r-check" style="margin-top:12px" disabled onclick="checkRedo()">${T("確かめる","Conferir")}</button>

}
function checkRedo(){
  const q = W.qs[W.i], na = looseKey($("r-ans").value), cands = q.a.map(x => looseKey(x));
  if(matchIdx($("r-ans").value, q.a) >= 0){
    W.recs.forEach(r => r.re = true); save();
    Party.rose(); stamp("書けた！✍️", "Conseguiu!");
    $("r-ans").disabled = true; ["r-check","r-skip","peek-btn"].forEach(id => $(id).style.display = "none");
    $("peek-box").style.display = "";
    $("r-after").innerHTML = `<div class="explain" style="background:var(--mint-s)"><div class="hd">${T("🌸 書けた！","Conseguiu!")}</div>${T("答えの例と同じだよ。","Igual ao exemplo de resposta.")}</div>
      <button class="block" style="margin-top:12px" onclick="doneW()">${T("次へ →","Próxima")}</button>`;
    scrollToAction(document.querySelector("#r-after button.block"));
  } else {
    $("r-after").innerHTML = `${cmpHtml(na, [cands[closest(na, cands)]])}<p class="muted small">${T("直して、もう一度「確かめる」を押してね。","Corrija e toque em “Conferir” de novo.")}</p>`;
  }
  applyPt();
}
function doneW(){
  settleW();

      <p>${T(`${W.qs.length}文書いて <b>${W.earned}</b> ポイント ゲット！`, `Você escreveu ${W.qs.length} frases e ganhou ${W.earned} pontos.`)}</p>
      ${nextStep("w")}
      <div class="grid2" style="margin-top:12px"><button class="ghost" onclick="go('home')">${T("ホーム","Início")}</button><button class="${nextStep("w") ? "ghost" : ""}" onclick="startWriting()">${T("もう3問","Mais 3")}</button></div>
    </div>`;
  setTimeout(() => { FX.confetti(140); FX.fireworks(3); stamp("よくできました！✏️", "Muito bem!"); }, 200);

/* ---------- 日記 ---------- */
function submitDiary(){
  const jp = $("d-jp").value.trim(), pt = $("d-pt").value.trim();
  if(jp.length < 6 || !/[ぁ-んァ-ヶ一-龥]/.test(jp)){ toast("もう少し書いてみよう 🙂"); return; }
  const k = sessKey(dqDay), d = day(k), first = d.diary === 0;
  d.diary++;
  const dq = diaryQ();
  S.diaries.unshift({date:k, jp, pt, ts:Date.now(), q:dq[0]});
  save();
  sendMail({subject:`📓 ${CONFIG.studentNameMail} の日記（${k}）`,
    body:`${CONFIG.studentNameMail} が日記を書きました（${k}）\n\n【画面に出ていたお題（参考）】\n${dq[0]}\n\n【日本語】\n${jp}\n\n【言いたかったこと】\n${pt || "（記入なし）"}\n\n${(CONFIG.studentEmail || CONFIG.replyByMail) ? "このメールに返信すると、そのまま彼女に添削が届きます。" : ""}`});
  $("d-jp").value = ""; $("d-pt").value = ""; saveDraft();
  // 日記で目標達成になったときは、達成の画面を出す（「送ったよ」はトーストで伝える）
  const wasMet = d.goalMet;
  addPoints(first ? CONFIG.points.diaryFirst : CONFIG.points.diaryMore, k);
  if(!wasMet && d.goalMet){ FX.rise(["💌","💗","💕"], 16); setTimeout(() => toast("送ったよ ✉️"), 1400); return; }
  Party.diary();
  modal(`${IMG("bunny-letter")}<h2>${T("送ったよ！","Enviado!")}</h2><p>${(CONFIG.studentEmail || CONFIG.replyByMail) ? T(`${CONFIG.teacherName}が読んで、メールで返事するね。`,"O Jas vai ler e responder por e-mail com as correções.") : T(`${CONFIG.teacherName}が読んで、返事するね。`,"O Jas vai ler e responder com as correções.")}</p><button class="block" onclick="closeModal()">OK</button>`);
  applyPt();
}
/* 日記の下書き（ほかのアプリに切りかえて iPhone が読みこみ直しても、書いた文が消えないように）。
   本体のキー（kotonoha-v1）には入れず、別のキーに置く。
   書き始めたときのお題（q）と日付（k）もいっしょに入れて、送るまでお題を変えない。 */
const DRAFT = KEY + "-draft";
let dqLock = null, dqDay = null;   // 書いている途中のお題と、書き始めた日
function saveDraft(){
  try{ const jp = $("d-jp").value, pt = $("d-pt").value;
    if(jp.trim() || pt.trim()){
      if(!dqLock) dqLock = diaryQ();
      if(!dqDay) dqDay = todayKey();
      localStorage.setItem(DRAFT, JSON.stringify({jp, pt, q:dqLock, k:dqDay}));
    } else { dqLock = null; dqDay = null; localStorage.removeItem(DRAFT); }
  }catch(e){}
}
function loadDraft(){
  try{ const d = JSON.parse(localStorage.getItem(DRAFT) || "null"); if(d){ $("d-jp").value = d.jp || ""; $("d-pt").value = d.pt || ""; dqLock = Array.isArray(d.q) ? d.q : null; dqDay = d.k || null; } }catch(e){}
  ["d-jp","d-pt"].forEach(id => $(id).addEventListener("input", saveDraft));
}
/* きょうの お題（日替わり。1日の区切り（CONFIG.dayStartHour）で切り替わる。「べつの おだい」で つぎへ）
   書いている途中（下書きがある間）は、書き始めたときのお題のまま。 */
let dqShift = 0;
function autoDiaryQ(){ const n = now0(); return DIARY_Q[(n.getFullYear()*372 + n.getMonth()*31 + n.getDate() + dqShift) % DIARY_Q.length]; }
function diaryQ(){ return dqLock || autoDiaryQ(); }
function nextDiaryQ(){ dqShift++; if(dqLock){ dqLock = autoDiaryQ(); saveDraft(); } renderDiaryQ(); applyPt(); }
function renderDiaryQ(){ const q = diaryQ(); $("d-q").innerHTML = T(furi(esc(q[0])), esc(q[1]), true); }
function renderDiaryList(){
  renderDiaryQ();
  const el = $("diary-list");
  if(!S.diaries.length){ el.innerHTML = `<div class="empty"><div class="big">🌱</div>${T("まだないよ。今日、初めての日記を書いてみよう！","Ainda não há diários. Que tal escrever o primeiro hoje?")}</div>`; return; }
  el.innerHTML = S.diaries.slice(0, 20).map(x => `<div class="item"><div class="muted small">${x.date}</div><div class="jpx">${esc(x.jp)}</div>${x.pt ? `<div class="muted small">${esc(x.pt)}</div>` : ""}</div>`).join("");
}
